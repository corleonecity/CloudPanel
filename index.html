<html lang="de">
<head>

  <link rel="preload" as="image" href="cover-1.jpeg" />
  <link rel="preload" as="image" href="cover-2.jpeg" />

  <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07080c;
      --fg: #f3f4f6;
      --muted: #a3a8b2;
      --glass: #101218;
      --sans: "Onest", ui-sans-serif, system-ui, sans-serif;
      --display: "Chillax", "Onest", ui-sans-serif, system-ui, sans-serif;
      --cursor: url("cursor.png") 16 16, auto;
    }
    * { box-sizing: border-box; }
    html, body, button, a, input { cursor: var(--cursor); }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--fg);
      font-family: var(--sans);
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
    .stage { min-height: 100vh; position: relative; overflow: hidden; }
    .yt-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #000; }
    .yt-bg video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      min-width: 100%; min-height: 100%;
      object-fit: cover; pointer-events: none; background: #000;
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 10%, color-mix(in oklab, var(--ink) 18%, transparent) 62%, color-mix(in oklab, var(--ink) 88%, transparent) 100%);
    }
    .enter {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #000;
    }
    .enter[hidden] { display: none; }
    .mark { width: 48px; height: 48px; animation: pulse 2.8s ease-in-out infinite; }
    .klicken { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .wrap {
      position: relative; z-index: 10;
      min-height: 100vh; width: 100%; margin: 0;
      display: grid; place-items: center;
      padding: 72px 16px;
    }
    .links {
      position: absolute; top: 50%; right: calc(50% + 14rem + 18px);
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px; width: 272px;
      max-height: calc(4 * 56px + 3 * 8px + 8px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.45) transparent;
      padding: 4px 4px 4px 2px;
    }
    .links::-webkit-scrollbar { width: 4px; background: transparent; }
    .links::-webkit-scrollbar-track { background: transparent; }
    .links::-webkit-scrollbar-thumb { background: rgba(255,255,255,.45); border-radius: 999px; }
    .stack { display: flex; flex-direction: column; gap: 8px; width: min(100%, 28rem); }
    .pill {
      display: flex; align-items: center; gap: 8px; flex: none;
      min-height: 56px; padding: 5px 14px 5px 5px; border-radius: 999px;
      text-decoration: none; color: #fff;
    }
    .pill-ico { width: 46px; height: 46px; border-radius: 999px; object-fit: cover; display: block; }
    .ico-glow { width: 46px; height: 46px; border-radius: 999px; flex: none; }
    .pill-copy { flex: 1; min-width: 0; text-align: center; padding-right: 6px; }
    .pill-title { display: block; font-weight: 700; font-size: 13px; line-height: 1.15; }
    .pill-url { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 1px; font-size: 11px; color: var(--muted); }
    .pill.empty { min-height: 56px; }
    @media (max-width: 1100px) {
      .wrap { display: flex; flex-direction: column; align-items: center; max-width: 28rem; margin: 0 auto; padding: 64px 16px; }
      .links { position: static; transform: none; width: 100%; order: 2; margin-top: 36px; }
    }
    .wrap[hidden] { display: none; }
    .glass {
      background: color-mix(in oklab, var(--glass) 52%, transparent);
      border: 1px solid color-mix(in oklab, var(--fg) 10%, transparent);
      box-shadow: 0 24px 60px color-mix(in oklab, black 45%, transparent);
      backdrop-filter: blur(18px);
      border-radius: 16px;
    }
    .pill.glass { border-radius: 999px; box-shadow: none; }
    .card { position: relative; padding: 28px 20px 10px; }
    .avatar {
      position: absolute; left: 18px; top: 0; width: 80px; height: 80px;
      transform: translateY(-46%); border-radius: 22px; object-fit: cover;
      box-shadow: 0 10px 24px rgba(0,0,0,.4);
    }
    .meta {
      min-height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .row { display: inline-flex; align-items: center; gap: 6px; }
    .sep { opacity: .7; }
    .name-row { margin-top: 18px; display: flex; align-items: center; gap: 8px; }
    h1 {
      position: relative; margin: 0;
      font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: 0.02em;
    }
    .sparkle {
      position: absolute; left: -16px; right: -16px; top: -12px; bottom: -12px; pointer-events: none;
      background: url("sparkle.gif") 0 0 / 90px 68px;
      mix-blend-mode: screen;
    }
    .gem {
      width: 24px; height: 24px; border-radius: 999px;
      display: grid; place-items: center; background: color-mix(in oklab, var(--fg) 10%, transparent);
    }
    .bio { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
    .discord { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .face { position: relative; width: 44px; height: 44px; flex: none; }
    .face img { width: 44px; height: 44px; border-radius: 999px; object-fit: cover; }
    .badge {
      position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px;
      border-radius: 999px; background: #0c0e14; display: grid; place-items: center;
    }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: #80848e; }
    .dot.online { background: #23a55a; }
    .dot.idle { background: #f0b232; }
    .dot.dnd { background: #f23f43; }
    .dot.offline { background: transparent; border: 2px solid #80848e; }
    .who { margin: 0; font-size: 14px; font-weight: 600; }
    .min { flex: 1; min-width: 0; }
    .play { margin: 2px 0 0; font-size: 13px; font-weight: 600; }
    .act { margin: 0; font-size: 12px; color: var(--muted); }
    .app { width: 46px; height: 46px; margin-left: auto; object-fit: contain; flex: none; border-radius: 10px; }
    .discord-slot { position: relative; }
    .lives {
      position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px; z-index: 5;
    }
    .lives[hidden] { display: none; }
    .live-pill {
      display: flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 6px 12px 6px 8px; border-radius: 999px;
      text-decoration: none; color: #fff; white-space: nowrap;
    }
    .live-pill.glass { border-radius: 999px; }
    .live-dot {
      width: 8px; height: 8px; border-radius: 999px; background: #ff3b3b; flex: none;
      box-shadow: 0 0 8px #ff3b3b;
    }
    .live-copy { display: flex; flex-direction: column; line-height: 1.1; }
    .live-copy b { font-size: 11px; letter-spacing: .06em; }
    .live-copy span { font-size: 10px; color: var(--muted); }
    @media (max-width: 780px) {
      .lives { position: static; transform: none; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }
    }
    .spotify {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px 8px 8px;
      text-decoration: none; color: #fff;
    }
    .spotify[hidden] { display: none; }
    .spotify img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex: none; }
    .spotify b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spotify em { display: block; margin-top: 2px; font-style: normal; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spotify small { display: block; margin-bottom: 2px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: #1ed760; }
    .player { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .cover { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex: none; }
    .track { min-width: 0; flex: 1; }
    .title { margin: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scrub-row { margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; flex: none; }
    .controls button { width: 32px; height: 32px; display: grid; place-items: center; }
    .time { width: 36px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .time.end { text-align: right; }
    input[type="range"].vol {
      width: 118px; height: 18px;
    }
    input[type="range"].vol::-webkit-slider-runnable-track {
      height: 4px; background: #fff;
    }
    input[type="range"].vol::-webkit-slider-thumb {
      width: 14px; height: 14px; margin-top: -5px; background: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.18);
    }
    .loud {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; color: #fff;
      background: rgba(12,12,16,.62);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    @media (hover: none) and (pointer: coarse) { .loud { display: none; } }
    @media (max-width: 800px) { .loud { display: none; } }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px; border-radius: 999px;
      background: linear-gradient(to right, var(--fg) var(--pct, 0%), color-mix(in oklab, var(--fg) 28%, transparent) var(--pct, 0%));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border: 0; border-radius: 999px; background: var(--fg);
    }
    @keyframes pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>

  <audio id="audio" preload="auto" src="song-1.mp3"></audio>
  <script>
    const API = "https://cobalt-fleet-wind-finch.grok.me";
    function logoGlow(color) {
      const hex = String(color || "").trim();
      if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(hex)) return "";
      return "0 0 0 1px " + hex + ", 0 0 8px 2px " + hex + ", 0 0 14px 2px " + hex;
    }
    function paintButtons(list) {
      const nav = document.getElementById("links");
      if (!nav || !Array.isArray(list)) return;
      nav.replaceChildren();
      list.forEach((item) => {
        const img = document.createElement("img");
        img.className = "pill-ico";
        img.src = item.bild || "";
        img.alt = "";
        img.width = 46;
        img.height = 46;
        const glow = document.createElement("span");
        glow.className = "ico-glow";
        const shine = logoGlow(item.farbe || item.color);
        if (shine) glow.style.boxShadow = shine;
        glow.append(img);
        if (item.link) {
          const link = document.createElement("a");
          link.className = "pill glass";
          link.href = item.link;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.append(glow);
          if (item.titel || item.text) {
            const copy = document.createElement("span");
            copy.className = "pill-copy";
            if (item.titel) {
              const title = document.createElement("span");
              title.className = "pill-title";
              title.textContent = item.titel;
              copy.append(title);
            }
            if (item.text) {
              const url = document.createElement("span");
              url.className = "pill-url";
              url.textContent = item.text;
              copy.append(url);
            }
            link.append(copy);
          }
          nav.append(link);
        } else {
          const box = document.createElement("div");
          box.className = "pill glass empty";
          box.append(glow);
          nav.append(box);
        }
      });
    }
    const FALLBACK_BUTTONS = [
      { bild: "buttom1.jpeg", titel: "Discord Colin’s Community", link: "https://discord.gg/4424J6EQBH", text: "discord.gg/4424J6EQBH" },
      { bild: "buttom2.jpeg", titel: "", link: "", text: "" },
      { bild: "buttom3.jpeg", titel: "", link: "", text: "" },
      { bild: "buttom4.jpeg", titel: "", link: "", text: "" }
    ];
    fetch("buttons.json", { cache: "no-store" })
      .then((res) => res.ok ? res.text() : "")
      .then((text) => {
        if (!text) return;
        const data = JSON.parse(text.replace(/}\s*{/g, "},{"));
        if (Array.isArray(data) && data.length) paintButtons(data);
      })
      .catch(() => {});
    const tracks = [
      { title: "Люби меня", src: "song-1.mp3", cover: "cover-1.jpeg" },
      { title: "Влюбился в неё", src: "song-2.mp3", cover: "cover-2.jpeg" }
    ];
    const audio = document.getElementById("audio");
    const scrub = document.getElementById("scrub");
    function randomIndex(except) {
      if (tracks.length < 2) return 0;
      let next = except;
      while (next === except) next = Math.floor(Math.random() * tracks.length);
      return next;
    }
    let index = randomIndex(-1);
    let playing = false;
    const history = [];
    function go(i, remember) {
      if (remember && i !== index) history.push(index);
      show(i);
      play();
    }
    function back() {
      if (!history.length) return;
      show(history.pop());
      play();
    }

    function clock(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ":" + String(s).padStart(2, "0");
    }
    function show(i) {
      index = (i + tracks.length) % tracks.length;
      const track = tracks[index];
      document.getElementById("title").textContent = track.title;
      document.getElementById("cover").src = track.cover;
      if (!audio.src.endsWith(track.src)) audio.src = track.src;
      document.getElementById("time").textContent = "0:00";
      document.getElementById("dur").textContent = "0:00";
      scrub.value = 0;
      scrub.style.setProperty("--pct", "0%");
    }
    function setIcon() {
      document.getElementById("play-icon").innerHTML = playing
        ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
      document.getElementById("play").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
    }
    function applyVol() {
      const vol = document.getElementById("vol");
      audio.volume = Number(vol.value);
      document.getElementById("vol-icon").innerHTML = Number(vol.value) === 0
        ? '<path d="M4 9v6h4l5 4V5L8 9H4zm13.2 3 2.1-2.1-1.4-1.4L15.8 10.6 13.7 8.5l-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/>'
        : '<path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-2-3.1v6.2a3.5 3.5 0 0 0 2-3.1z"/>';
    }
    document.getElementById("vol").addEventListener("input", applyVol);
    function play() {
      applyVol();
      audio.play().then(() => { playing = true; setIcon(); }).catch(() => { playing = false; setIcon(); });
    }
    function primeVideo() {
      const bg = document.getElementById("bg");
      if (!bg) return;
      const phone = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.matchMedia("(max-width: 800px)").matches;
      if (phone) bg.src = "bg.mp4";
      bg.muted = true;
      bg.defaultMuted = true;
      bg.playsInline = true;
      bg.preload = "auto";
      bg.load();
      const pending = bg.play();
      if (pending) pending.then(() => { bg.pause(); try { bg.currentTime = 0; } catch (e) {} }).catch(() => {});
    }
    function startVideo() {
      const bg = document.getElementById("bg");
      if (!bg) return;
      try { bg.currentTime = 0; } catch (e) {}
      const kick = () => { const pending = bg.play(); if (pending) pending.catch(() => {}); };
      kick();
      bg.addEventListener("canplay", kick, { once: true });
    }
    primeVideo();
    ["avatar.webp", "sparkle.gif", "cursor.png", "buttom1.jpeg", "buttom2.jpeg", "buttom3.jpeg", "buttom4.jpeg"].forEach((src) => { const img = new Image(); img.src = src; });
    let opened = false;
    function primeSongs() {
      tracks.forEach((track) => {
        const extra = new Audio();
        extra.preload = "auto";
        extra.src = track.src;
        extra.load();
        if (track.cover) {
          const img = new Image();
          img.src = track.cover;
        }
      });
      show(index);
    }
    function useSongs(list) {
      const next = list.map((item) => ({
        title: item.titel || item.title || "",
        src: item.datei || item.src || "",
        cover: item.cover || ""
      })).filter((item) => item.src);
      if (!next.length) return;
      tracks.splice(0, tracks.length, ...next);
      if (opened) return;
      index = randomIndex(-1);
      primeSongs();
    }
    fetch("songs.json", { cache: "no-store" })
      .then((res) => res.ok ? res.text() : "")
      .then((text) => {
        if (!text) return;
        const data = JSON.parse(text.replace(/}\s*{/g, "},{"));
        if (Array.isArray(data)) useSongs(data);
      })
      .catch(() => {});
    primeSongs();
    function openPage() {
      if (opened) return;
      opened = true;
      startVideo();
      document.getElementById("enter").hidden = true;
      document.getElementById("page").hidden = false;
      show(index);
      play();
    }
    document.getElementById("enter").addEventListener("pointerup", openPage);
    document.getElementById("enter").addEventListener("click", openPage);
    document.getElementById("play").addEventListener("click", () => {
      if (audio.paused) play();
      else { audio.pause(); playing = false; setIcon(); }
    });
    document.getElementById("prev").addEventListener("click", back);
    document.getElementById("next").addEventListener("click", () => { go(randomIndex(index), true); });
    audio.addEventListener("timeupdate", () => {
      document.getElementById("time").textContent = clock(audio.currentTime);
      scrub.value = audio.currentTime;
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      scrub.style.setProperty("--pct", pct + "%");
    });
    audio.addEventListener("loadedmetadata", () => {
      document.getElementById("dur").textContent = clock(audio.duration);
      scrub.max = audio.duration || 0;
    });
    audio.addEventListener("ended", () => { go(randomIndex(index), true); });
    scrub.addEventListener("input", () => {
      audio.currentTime = Number(scrub.value);
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      scrub.style.setProperty("--pct", pct + "%");
    });

    const views = document.getElementById("views");
    const wait = 10 * 60 * 1000;
    let viewer = "";
    let count = true;
    try {
      viewer = localStorage.getItem("colin-viewer") || "";
      if (!viewer) {
        viewer = Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem("colin-viewer", viewer);
      }
      const last = Number(localStorage.getItem("colin-view-at") || 0);
      count = !last || Date.now() - last >= wait;
      if (count) localStorage.setItem("colin-view-at", String(Date.now()));
    } catch (e) { count = true; }
    fetch(API + "/api/views", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ increment: count, viewer: viewer }) })
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        if (!data || typeof data.count !== "number") return;
        views.textContent = String(data.count);
      })
      .catch(() => {});

    function activityLogo(card) {
      return card.icon || "";
    }
    function paintDiscord(card) {
      document.getElementById("discord-name").textContent = card.username || "asuna.rb";
      document.getElementById("discord-play").textContent = (card.headline || card.activity || "currently doing nothing").replace(/\s+with\s+medal\b/gi, "").trim();
      if (card.avatar) document.getElementById("discord-avatar").src = card.avatar;
      const app = document.getElementById("discord-app");
      const logo = activityLogo(card);
      if (logo) { app.src = logo; app.hidden = false; }
      else { app.hidden = true; app.removeAttribute("src"); }
      const dot = document.getElementById("status-dot");
      dot.className = "dot " + (card.status || "offline");
      const label = card.status === "online" ? "online" : card.status === "idle" ? "abwesend" : card.status === "dnd" ? "nicht stören" : "offline";
      document.getElementById("status-label").title = label;
      const spotify = document.getElementById("spotify");
      const song = card.spotify;
      if (song && (song.title || song.artist)) {
        spotify.hidden = false;
        spotify.href = song.url || "https://open.spotify.com";
        document.getElementById("spotify-title").textContent = song.title || "Spotify";
        document.getElementById("spotify-artist").textContent = song.artist || "";
        const cover = document.getElementById("spotify-cover");
        if (song.cover) { cover.hidden = false; cover.src = song.cover; }
        else { cover.hidden = true; cover.removeAttribute("src"); }
      } else {
        spotify.hidden = true;
      }
    }
    function pullDiscord() {
      fetch(API + "/api/discord", { cache: "no-store" }).then((res) => res.ok ? res.json() : null).then((data) => { if (data) paintDiscord(data); }).catch(() => {});
    }
    function liveIcon(platform) {
      if (platform === "twitch") return '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M4 3h16v11l-4 4h-4l-2 2H8v-2H4V3zm2 2v10h3v2l2-2h4l3-3V5H6zm9 6h-2V7h2v4zm-4 0H9V7h2v4z"/></svg>';
      return '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#25F4EE" d="M14.2 3h2.1a4.8 4.8 0 0 0 3.2 3.1V8a6.8 6.8 0 0 1-3.2-1v6.1a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .8.1v2.2a3.3 3.3 0 1 0 2.3 3.2V3z"/><path fill="#FE2C55" d="M13.4 3h2.1a4.8 4.8 0 0 0 3.2 3.1V8a6.8 6.8 0 0 1-3.2-1v6.1a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .8.1v2.2a3.3 3.3 0 1 0 2.3 3.2V3z"/><path fill="#fff" d="M13.8 3h2.1a4.8 4.8 0 0 0 3.2 3.1V8a6.8 6.8 0 0 1-3.2-1v6.1a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .8.1v2.2a3.3 3.3 0 1 0 2.3 3.2V3z"/></svg>';
    }
    function paintLive(items) {
      const box = document.getElementById("lives");
      box.replaceChildren();
      if (!items || !items.length) { box.hidden = true; return; }
      box.hidden = false;
      items.forEach((item) => {
        const link = document.createElement("a");
        link.className = "live-pill glass";
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noreferrer";
        const dot = document.createElement("span");
        dot.className = "live-dot";
        const icon = document.createElement("span");
        icon.innerHTML = liveIcon(item.platform);
        const copy = document.createElement("span");
        copy.className = "live-copy";
        const title = document.createElement("b");
        title.textContent = "LIVE";
        const name = document.createElement("span");
        name.textContent = item.platform === "twitch" ? "Twitch" : "@" + item.name;
        copy.append(title, name);
        link.append(dot, icon, copy);
        box.append(link);
      });
    }
    function pullLive() {
      fetch(API + "/api/live").then((res) => res.ok ? res.json() : null).then((data) => { if (data) paintLive(data.items || []); }).catch(() => {});
    }
    pullDiscord();
    pullLive();
    setInterval(pullDiscord, 5000);
    setInterval(pullLive, 60000);
  </script>
</body>
</html>
