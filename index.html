<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Stillwater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0b1114;--surface:#12191d;--raised:#182026;--inset:#0e1418;
  --fg:#e8ece9;--muted:#8b9691;--subtle:#66716c;--accent:#b8c4bc;--accent-fg:#0b1114;
  --line:rgba(232,236,233,.12);--line2:rgba(232,236,233,.22);
  --danger:#c45c4a;--ok:#6f9b7a;--warn:#c4a574;
  --r-trash:#7a847e;--r-common:#9aaca3;--r-uncommon:#6f9b7a;--r-rare:#6a8aa3;
  --r-epic:#8a7a9a;--r-legendary:#c4a574;--r-mythic:#c9d4cc;
  --display:"Fraunces","Iowan Old Style",Palatino,serif;
  --sans:"Figtree","Segoe UI",system-ui,sans-serif;
  --sky-top:#1c2830;--sky-mid:#3a4c4a;--sky-bot:#1a2e2c;--water-a:#1b3a38;--water-b:#0f2424;--hill:#14241f;--foam:rgba(184,196,188,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button:not(:disabled),[role=button]:not(:disabled){cursor:pointer}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;font-weight:500;margin:0}
p{margin:0}
#app{max-width:32rem;margin:0 auto;min-height:100dvh}
.screen{min-height:100dvh;display:flex;flex-direction:column}
.title{position:relative;align-items:center;justify-content:center;text-align:center;padding:1.5rem;overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(61,107,102,.18),transparent 55%);pointer-events:none}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.play{padding:calc(.75rem + env(safe-area-inset-top)) .75rem calc(5.5rem + env(safe-area-inset-bottom))}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--danger)} .rare{color:var(--accent)}
.xp{height:4px;background:var(--inset);border-radius:99px;overflow:hidden;margin:8px 0 10px}
.xp>i{display:block;height:100%;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:12px;padding:.7rem 1rem;background:var(--accent);color:var(--accent-fg);font-weight:600;min-height:44px;transition:transform .12s ease,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{width:100%;padding:1rem;font-size:1.05rem;border-radius:14px;margin-top:12px}
.btn.sec{background:var(--raised);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid transparent}
.btn.sm{min-height:34px;padding:.35rem .7rem;font-size:12px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:4px 10px;font-size:11px;color:var(--muted)}
.log{margin-top:12px;flex:1;min-height:120px;max-height:28vh;overflow:auto;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px}
.log p{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.log p:last-child{border:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);background:rgba(18,25,29,.96);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:32rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:0;border:0;color:var(--muted);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.nav button:hover{color:var(--fg)}
.nav svg{width:20px;height:20px}
.scene{position:relative;overflow:hidden;isolation:isolate;height:210px;border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 38%,var(--sky-bot) 58%,var(--water-a) 58%,var(--water-b) 100%)}
.scene[data-time=dawn]{--sky-top:#5a3a38;--sky-mid:#d49268;--sky-bot:#8aa078;--water-a:#24544c;--water-b:#163832}
.scene[data-time=day]{--sky-top:#8eb8c4;--sky-mid:#d5e4e0;--sky-bot:#7eaa98;--water-a:#2f6a60;--water-b:#1a4840}
.scene[data-time=dusk]{--sky-top:#3a2848;--sky-mid:#d07458;--sky-bot:#6a5048;--water-a:#1e4044;--water-b:#12282c}
.scene[data-time=night]{--sky-top:#0c1018;--sky-mid:#1a2438;--sky-bot:#121c22;--water-a:#102428;--water-b:#0a1618}
.scene[data-weather=storm]{filter:saturate(.7) brightness(.85)}
.scene[data-weather=fog]::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(200,210,208,.18),transparent 50%);pointer-events:none;z-index:6}
.wave{position:absolute;left:-10%;width:220%;height:28px;background:linear-gradient(180deg,var(--foam),transparent 70%);border-radius:50%;animation:waveShift 7s linear infinite;pointer-events:none}
.wave.w2{animation-duration:11s;animation-direction:reverse;opacity:.55;height:22px}
.star{position:absolute;width:2px;height:2px;background:#e8ece9;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
.reed{position:absolute;bottom:18%;width:4px;background:#1e3a32;transform-origin:bottom;animation:sway 5s ease-in-out infinite;border-radius:4px 4px 0 0;z-index:2}
.bobber{position:absolute;z-index:5;width:12px;height:12px;border-radius:50%;border:2px solid #5a2018;background:var(--danger);box-shadow:0 0 8px rgba(196,92,74,.7);left:60%;bottom:18%}
.rain-sheet{position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(165deg,transparent 0 6px,rgba(232,236,233,.18) 6px 7px);background-size:100% 120px;animation:rain .35s linear infinite}
.bubble{position:absolute;z-index:10;width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:rgba(232,236,233,.12);backdrop-filter:blur(4px)}
.bubble i{display:block;width:22px;height:22px;margin:12px auto;border-radius:50%;border:1px solid rgba(184,196,188,.7);background:rgba(184,196,188,.2)}
.overlay,.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(11,17,20,.78);padding:16px}
.modal-bg{align-items:flex-end;z-index:40}
@media(min-width:640px){.modal-bg{align-items:center}}
.panel{width:100%;max-width:28rem;max-height:86dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:18px 18px 16px}
.panel.wide{max-width:40rem}
.panel h2{font-size:1.15rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:12px}
.card.on{border-color:var(--accent)}
.grid2{display:grid;gap:16px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:480px){.grid4{grid-template-columns:repeat(4,1fr)}}
.bar{height:10px;background:var(--inset);border-radius:99px;overflow:hidden;position:relative}
.bar.lg{height:40px}
.bar .fill{height:100%;background:var(--accent)}
.bar .zone{position:absolute;inset-block:0;background:rgba(111,155,122,.55)}
.bar .cur{position:absolute;top:0;width:4px;height:100%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hidden{display:none!important}
.tut{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(11,17,20,.5);padding:16px}
.flex{display:flex;gap:8px}
.grow{flex:1}
.center{text-align:center}
select,textarea{width:100%;background:var(--inset);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
@keyframes waveShift{to{transform:translate3d(-50%,0,0)}}
@keyframes bob{0%,100%{transform:translate3d(0,0,0) rotate(-2deg)}50%{transform:translate3d(0,-4px,0) rotate(2deg)}}
@keyframes bobBite{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,14px,0) scale(.78)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rain{to{background-position:0 120px}}
@keyframes catchPop{0%{transform:translate3d(-50%,10px,0) scale(.4);opacity:0}35%{transform:translate3d(-50%,-42px,0) scale(1.15);opacity:1}100%{transform:translate3d(-50%,-78px,0) scale(1.35);opacity:0}}
@keyframes ripple{from{transform:scale(.4);opacity:.8}to{transform:scale(2.6);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes aurora{0%,100%{opacity:.25;transform:translate3d(-6%,0,0)}50%{opacity:.5;transform:translate3d(6%,0,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

function money(n){const v=Math.floor(n);if(Math.abs(v)>=1e6)return (v/1e6).toFixed(2)+" Mio $";return v.toLocaleString("de-DE")+" $"}
function weight(g){if(!g)return "0 g";return g>=1000?(g/1000).toFixed(2)+" kg":Math.floor(g)+" g"}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){if(c==="&")return"\u0026amp;";if(c==="<")return"\u0026lt;";if(c===">")return"\u0026gt;";if(c==='"')return"\u0026quot;";return"\u0026#39;"})}
function hashN(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function timeOfDay(d){const h=(d||new Date()).getHours();if(h>=5&&h<8)return "dawn";if(h>=8&&h<17)return "day";if(h>=17&&h<20)return "dusk";return "night"}
function weatherAt(d){d=d||new Date();const slot=Math.floor(d.getTime()/(12*60*1000));const tod=timeOfDay(d);const r=hashN(slot+17);if(tod==="night"&&r>0.82)return "aurora";if(r<0.12)return "storm";if(r<0.28)return "rain";if(r<0.42)return "fog";if(r<0.62)return "overcast";return "clear"}
function eventAt(d){d=d||new Date();const slot=Math.floor(d.getTime()/(18*60*1000));const r=hashN(slot+91);const until=(slot+1)*18*60*1000;if(r<0.16)return {id:"frenzy",name:"Fressrausch",until};if(r<0.28)return {id:"gleam",name:"Goldene Stunde",until};if(r<0.38)return {id:"market",name:"Markttag",until};if(r<0.46)return {id:"lull",name:"Flaute",until};return null}
function familyPriceMod(family,d){d=d||new Date();const day=Math.floor(d.getTime()/86400000);const r=hashN(day+family.length*13+family.charCodeAt(0));return 0.78+r*0.52}

function glyph(f,shiny,size){
  size=size||44;const h=f.hue;let hv=2166136261;for(let i=0;i<f.id.length;i++)hv=Math.imul(hv^f.id.charCodeAt(i),16777619);hv=hv>>>0;
  const sat=shiny?72:f.rarity==="trash"?12:42+(hv%18);
  const lit=shiny?62:f.rarity==="mythic"?70:42+(hv%12);
  const fill=`hsl(${h} ${sat}% ${lit}%)`;
  const stroke=`hsl(${h} ${sat+8}% ${Math.max(18,lit-22)}%)`;
  const gid="g"+f.id.replace(/[^a-z0-9]/gi,"")+ (shiny?"s":"");
  const spots=(hv%5)+(shiny?3:0);
  let extra="";
  for(let i=0;i<spots;i++) extra+=`<circle cx="${12+((hv>>(i*3))%18)}" cy="${16+((hv>>(i*2))%8)}" r="${0.8+(i%2)*0.4}" fill="hsl(${h} ${sat}% ${Math.max(16,lit-18)}%)" opacity=".55"/>`;
  const fillUse=shiny?`url(#${gid})`:fill;
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 40" aria-hidden>${shiny?`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="hsl(${(h+40)%360} 70% 70%)"/><stop offset="100%" stop-color="${fill}"/></linearGradient></defs>`:""}<path d="${PATH[f.family]}" fill="${fillUse}" stroke="${stroke}" stroke-width="1.2"/><circle cx="${f.family==="eel"?30:16}" cy="18" r="1.4" fill="#0b1114"/>${extra}</svg>`;
}

function biteWindow(){
  const rod=rodById(S.eqRod);const bait=S.eqBait!=="none"?baitById(S.eqBait):null;
  let w=0.18+rod.luck/400+(bait?.luck||0)/500+S.skills.gleam*0.001;
  if(eventAt()?.id==="gleam")w+=0.04;return Math.min(0.28,w);
}
function matches(f,weather){
  let m=f.weight;const tod=timeOfDay();
  if(f.time&&f.time!=="any"&&f.time!==tod)m*=0.28;
  if(f.weather&&!f.weather.includes(weather))m*=0.22;
  if(f.depth&&f.depth!=="any"&&f.depth!==S.depth)m*=0.45;
  if(f.depth===S.depth)m*=1.25;
  const rod=rodById(S.eqRod);const bait=S.eqBait!=="none"?baitById(S.eqBait):null;
  const luck=rod.luck+(bait?.luck||0)+S.boatTier*3+(S.buff?.skill==="gleam"?S.buff.amount:0);
  if(f.rarity==="trash")m*=1-(bait?.trashRed||0)/100;else if(f.weight<=3)m*=1+luck/90;
  if(bait?.family&&bait.family===f.family)m*=1.45;
  const ev=eventAt();if(ev?.id==="frenzy"&&f.rarity!=="trash")m*=1.35;
  if(ev?.id==="gleam"&&(f.rarity==="epic"||f.rarity==="legendary"||f.rarity==="mythic"))m*=1.5;
  if(weather==="aurora"&&(f.family==="mythic"||f.family==="salmon"))m*=1+0.2+S.skills.sky*0.02;
  if(weather==="storm"&&f.family==="pelagic")m*=1.3+S.skills.sky*0.015;
  if(weather==="fog"&&f.family==="eel")m*=1.25;
  return Math.max(0.02,m);
}
function rollFish(){
  const weather=weatherAt();const pool=FISH.filter(f=>f.zone===S.zone);
  const weighted=pool.map(f=>({f,w:matches(f,weather)}));const total=weighted.reduce((a,x)=>a+x.w,0);
  let r=Math.random()*total;let pick=pool[0];
  for(const x of weighted){if(r<x.w){pick=x.f;break}r-=x.w}
  const g=pick.minG+Math.random()*(pick.maxG-pick.minG);
  const pct=(g-pick.minG)/Math.max(1,pick.maxG-pick.minG);
  let value=pick.rarity==="trash"?pick.value:Math.max(1,Math.floor(pick.value*(0.55+pct*0.9)));
  let xp=pick.xp;const ev=eventAt();
  let shinyChance=0.008+S.skills.gleam*0.00035+(S.buff?.skill==="gleam"?S.buff.amount/2000:0);
  if(ev?.id==="gleam")shinyChance*=3.2;if(weather==="aurora")shinyChance*=1.6;
  const shiny=pick.rarity!=="trash"&&Math.random()<shinyChance;
  if(shiny){value=Math.abs(value)*5;xp=Math.abs(xp)*5}
  return {id:uid(),fishId:pick.id,name:pick.name,shiny,trash:pick.rarity==="trash",value,xp,weightG:g,hue:pick.hue,family:pick.family,rarity:pick.rarity,caughtAt:Date.now()};
}
function sellValue(item){
  if(item.value<=0)return item.value;let v=item.value;
  v*=1+S.prestige*0.012;v*=1+S.skills.ledger*0.01;
  if(S.buff?.skill==="sell")v*=1+S.buff.amount/100;
  if(eventAt()?.id==="market")v*=1.25;v*=familyPriceMod(item.family);
  return Math.floor(v);
}
function fightNeeded(c){return c.rarity==="rare"||c.rarity==="epic"||c.rarity==="legendary"||c.rarity==="mythic"||c.shiny}
function fightPower(){const rod=rodById(S.eqRod);const bait=S.eqBait!=="none"?baitById(S.eqBait):null;let p=18+rod.grip+(bait?.grip||0)+S.skills.grip*1.4;if(S.buff?.skill==="grip")p+=S.buff.amount;return p}
function fishPower(c){const base={trash:8,common:14,uncommon:22,rare:34,epic:48,legendary:64,mythic:82}[c.rarity];return base+c.weightG/900+(c.shiny?10:0)}
function rodSnaps(c){const rod=rodById(S.eqRod);const cap=(rod.maxKg+S.skills.grip*0.4)*1000;return c.weightG>cap*1.35}

function applyCatch(c){
  S.inventory.push(c);S.stats.totalCaught+=1;if(c.shiny)S.stats.shinies+=1;
  if(c.weightG>S.stats.biggestG){S.stats.biggestG=c.weightG;S.stats.biggestName=c.name}
  const dex=S.dex[c.fishId]||{normal:false,shiny:false,count:0,maxW:0};
  dex.count+=1;if(c.shiny)dex.shiny=true;else dex.normal=true;if(c.weightG>dex.maxW)dex.maxW=c.weightG;
  S.dex[c.fishId]=dex;grantXp(c.xp);bumpQ("c",1);consumeBait();checkMeta();
  const tag=c.shiny?"Mutation":c.rarity==="trash"?"Treibgut":"Fang";
  logLine(tag+": "+(c.shiny?"mut. ":"")+c.name,c.shiny||c.rarity==="legendary"||c.rarity==="mythic"?"rare":"ok");
  UI.phase="idle";UI.pending=null;UI.juice={kind:c.shiny||c.rarity==="mythic"?"rare":"catch",catch:c,at:Date.now()};
  persist();paint();
}

function tickEconomy(now){
  let ch=false;
  if(S.bank.unlocked&&S.bank.deposited>0&&now-S.bank.last>=7200000){
    const cycles=Math.floor((now-S.bank.last)/7200000);let dep=S.bank.deposited,earned=0;
    for(let i=0;i<cycles;i++){const inc=Math.floor(dep*0.04);dep+=inc;earned+=inc}
    S.bank.deposited=dep;S.bank.interest+=earned;S.bank.last+=cycles*7200000;logLine("Bankzinsen +"+earned+" $","ok");ch=true;
  }
  if(S.aquarium.unlocked&&S.aquarium.fishes.length&&now-(S.lastAqua||0)>=60000){
    const mins=Math.max(1,Math.floor((now-(S.lastAqua||now-60000))/60000));const cap=Math.min(mins,30);let inc=0;
    for(const f of S.aquarium.fishes)inc+=Math.max(1,Math.floor(Math.abs(f.value)*0.08*(1+S.skills.tide*0.012)*(S.buff?.skill==="tide"?1+S.buff.amount/100:1)));
    inc*=cap;S.money+=inc;S.lastAqua=now;if(inc>0)logLine("Becken +"+inc+" $","ok");ch=true;
  }
  if(S.autoFish&&now-(S.lastAuto||0)>=50000&&UI.phase==="idle"&&S.inventory.length<INV_CAP){
    S.lastAuto=now;applyCatch(rollFish());return;
  }
  if(S.buff&&now>=S.buff.until){S.buff=null;ch=true}
  resetQuests();if(ch){persist();paintHUD()}
}

}

let raf=0,last=0,bubbleT=0;
function loop(t){
  const dt=Math.min(0.05,(t-(last||t))/1000);last=t;
  if(UI.phase==="cast"){
    UI.castP+=UI.castDir*dt*1.35;if(UI.castP>=1){UI.castP=1;UI.castDir=-1}if(UI.castP<=0){UI.castP=0;UI.castDir=1}
    const cur=document.querySelector(".overlay .cur");if(cur)cur.style.left=(UI.castP*100)+"%";
  }
  if(UI.phase==="bite"){
    UI.biteX+=UI.biteDir*dt*1.15;if(UI.biteX>=1){UI.biteX=1;UI.biteDir=-1}if(UI.biteX<=0){UI.biteX=0;UI.biteDir=1}
    const cur=document.querySelector(".overlay .cur");if(cur)cur.style.left=(UI.biteX*100)+"%";
  }
  if(UI.phase==="fight"&&UI.pending&&!UI.fightDone){
    const foe=fishPower(UI.pending),player=fightPower();
    UI.tension=Math.max(0,UI.tension-(foe/Math.max(12,player))*22*dt);
    const fill=document.querySelector(".overlay .fill");if(fill)fill.style.width=UI.tension+"%";
    const lab=document.querySelector(".overlay .mono");if(lab)lab.textContent=Math.floor(UI.tension)+" / 100";
    if(UI.tension<=0){UI.fightDone=true;endFight(false)}
    else if(UI.tension>=100){UI.fightDone=true;endFight(true)}
  }
  if(UI.phase==="wait"){
    UI.waitLeft-=dt;
    if(UI.waitLeft<=0){UI.waitLeft=0;UI.pending=rollFish();UI.phase="bite";UI.biteX=0;UI.biteDir=1;UI.bubble=null;paint();return}
    const bar=document.getElementById("waitfill");
    if(bar)bar.style.width=((1-UI.waitLeft/UI.waitTotal)*100)+"%";
  }
  raf=requestAnimationFrame(loop);
}
function startLoop(){cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(loop)}
function endFight(won){
  const c=UI.pending;if(!c){UI.phase="idle";paint();return}
  if(!won){
    if(rodSnaps(c)){S.stats.snaps+=1;logLine("Schnur gerissen.","bad")}else{S.stats.escaped+=1;logLine("Im Drill verloren.","bad")}
    UI.phase="idle";UI.pending=null;UI.juice={kind:"miss",at:Date.now()};persist();paint();return;
  }
  applyCatch(c);
}

document.addEventListener("click",e=>{
  const bg=e.target.closest("[data-act=backdrop]");
  if(bg&&!e.target.closest("[data-stop]")){UI.menu=null;paint();return}
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,id=el.dataset.id,n=+el.dataset.n;
  if(act==="start"){S.started=true;S.tutorial=S.tutorial||1;persist();paint();return}
  if(act==="close"){UI.menu=null;UI.wheelRes=null;paint();return}
  if(act==="menu"){UI.menu=id;paint();return}
  if(act==="cast"){
    if(UI.phase!=="idle")return;
    if(S.inventory.length>=INV_CAP){logLine("Rucksack voll — verkaufen oder ablegen.","bad");paint();return}
    UI.phase="cast";UI.castP=.5;UI.castDir=1;paint();return;

    if(!hit){S.stats.escaped+=1;logLine("Entwischt.","bad");UI.phase="idle";UI.pending=null;UI.juice={kind:"miss",at:Date.now()};persist();paint();return}
    if(fightNeeded(UI.pending)){UI.phase="fight";UI.tension=42;UI.fightDone=false;paint()}else applyCatch(UI.pending);return}
  if(act==="pull"){if(UI.phase!=="fight"||UI.fightDone)return;UI.tension=Math.min(100,UI.tension+7+fightPower()*0.08);return}

  if(act==="sellall"){let add=0;for(const i of S.inventory)add+=sellValue(i);if(add>0){S.stats.totalEarned+=add;bumpQ("e",add)}logLine("Alles verkauft +"+add+" $","ok");S.inventory=[];S.money+=add;checkMeta();persist();paint();return}
  if(act==="todex"){const item=S.inventory.find(i=>i.id===id);if(!item||item.trash)return;const d=S.dex[item.fishId]||{normal:false,shiny:false,count:0,maxW:0};if(item.shiny&&d.shiny){logLine("Mutation schon im Atlas.","bad");paint();return}if(!item.shiny&&d.normal){logLine("Art schon im Atlas.","bad");paint();return}if(item.shiny)d.shiny=true;else d.normal=true;S.dex[item.fishId]=d;S.inventory=S.inventory.filter(i=>i.id!==id);checkMeta();logLine("Im Atlas vermerkt.","ok");persist();paint();return}
  if(act==="toaqua"){if(!S.aquarium.unlocked||S.aquarium.fishes.length>=AQUA_CAP){logLine("Becken voll.","bad");paint();return}const item=S.inventory.find(i=>i.id===id);if(!item||item.trash)return;S.inventory=S.inventory.filter(i=>i.id!==id);S.aquarium.fishes.push(item);checkMeta();logLine("Ins Becken gesetzt.","ok");persist();paint();return}

    S.inventory=inv;S.stats.cooked+=1;S.buff={skill:rec.buff.skill,amount:rec.buff.amount,until:Date.now()+rec.buff.minutes*60000};logLine("Gekocht: "+rec.name,"ok");checkMeta();persist();paint();return;
  }
  if(act==="prestige"){const r=prestigeReq(S.prestige);if(S.level<r.level||S.money<r.money)return;S.prestige+=1;S.money=80;S.xp=0;S.level=1;S.inventory=[];S.zone=0;S.skills={gleam:0,current:0,grip:0,tide:0,ledger:0,sky:0};logLine("Prestige "+S.prestige+".","rare");checkMeta();persist();paint();return}
  if(act==="title"){if(S.titles.includes(id))S.title=id;persist();paint();return}
  if(act==="set"){S.settings[id]=!S.settings[id];persist();paint();return}
  if(act==="dextab"){UI.dexTab=id;paint();return}
  if(act==="skiptut"){S.tutorial=99;persist();paint();return}
  if(act==="nexttut"){S.tutorial=S.tutorial>=4?99:S.tutorial+1;persist();paint();return}
  if(act==="export"){const box=document.getElementById("savebox");if(box)box.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));return}
  if(act==="import"){const box=document.getElementById("savebox");if(!box||!box.value.trim())return;try{const p=JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))));S=Object.assign(defaultSave(),p);S.started=true;persist();paint()}catch(err){logLine("Import fehlgeschlagen.","bad");paint()}return}
  if(act==="wipe"){if(!confirm("Spielstand löschen?"))return;S=defaultSave();S.started=true;persist();paint();return}
});
document.addEventListener("change",e=>{
  if(e.target.dataset.act==="dexz"){UI.dexZ=e.target.value==="all"?"all":e.target.value;paint()}
});

load();
if(S.started)UI.screen="play";
paint();
startLoop();
setInterval(()=>tickEconomy(Date.now()),1000);
setInterval(()=>{
  if(UI.phase==="wait"&&!UI.bubble&&Date.now()>bubbleT){UI.bubble={x:12+Math.random()*70,y:18+Math.random()*50};const sc=document.querySelector(".scene");if(sc){const b=document.createElement("button");b.className="bubble";b.dataset.act="bubble";b.style.left=UI.bubble.x+"%";b.style.top=UI.bubble.y+"%";b.innerHTML="<i></i>";sc.appendChild(b)}}
  if(UI.juice&&Date.now()-UI.juice.at>1000)UI.juice=null;
},400);
window.addEventListener("pagehide",()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});
})();
</script>
</body>
</html>
