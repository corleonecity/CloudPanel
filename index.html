  <style>
    :root {
      --ink: #07080c;
      --fg: #f3f4f6;
      --muted: #a3a8b2;
      --glass: #101218;
      --sans: "Onest", ui-sans-serif, system-ui, sans-serif;
      --display: "Chillax", "Onest", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--fg);
      font-family: var(--sans);
    }
    button { cursor: pointer; font: inherit; color: inherit; background: none; border: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }

    .bg { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; filter: blur(12px) brightness(1.12) saturate(0.92); transform: scale(1.1); pointer-events: none; }
    .bg[hidden] { display: none !important; }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 10%, color-mix(in oklab, var(--ink) 18%, transparent) 62%, color-mix(in oklab, var(--ink) 88%, transparent) 100%);
    }
    .glass {
      background: color-mix(in oklab, var(--glass) 52%, transparent);
      border: 1px solid color-mix(in oklab, var(--fg) 10%, transparent);
      box-shadow: 0 24px 60px color-mix(in oklab, black 45%, transparent);
      backdrop-filter: blur(18px);
      border-radius: 1rem;
    }
    .enter {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      background: #000;
    }
    .enter[hidden], .sheet[hidden] { display: none; }
    .mark { width: 3rem; height: 3rem; animation: pulse 2.8s ease-in-out infinite; }
    .hint { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .sheet {
      position: relative; z-index: 10;
      max-width: 28rem; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; gap: 0.75rem;
      padding: 4rem 1rem;
    }
    .card { padding: 1rem 1.25rem 1.25rem; }
    .row { display: flex; align-items: flex-start; gap: 0.75rem; }
    .avatar { width: 4rem; height: 4rem; border-radius: 999px; object-fit: cover; filter: grayscale(1); flex-shrink: 0; }
    .meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; padding-top: 0.25rem; font-size: 0.75rem; color: var(--muted); }
    .meta span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .name { margin: 1rem 0 0; display: flex; align-items: center; gap: 0.5rem; font-family: var(--display); font-size: 1.875rem; line-height: 1; font-weight: 600; letter-spacing: 0.02em; }
    .gem { width: 1.5rem; height: 1.5rem; border-radius: 999px; display: grid; place-items: center; background: color-mix(in oklab, var(--fg) 10%, transparent); }
    .bio { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--muted); }
    .presence { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; }
    .orb { width: 2.75rem; height: 2.75rem; border-radius: 999px; object-fit: cover; }
    .presence p { margin: 0; }
    .presence .who { font-size: 0.875rem; font-weight: 500; }
    .presence .doing { font-size: 0.75rem; color: var(--muted); }
    .player { padding: 0.75rem; }
    .player-row { display: flex; align-items: center; gap: 0.75rem; }
    .cover { width: 3rem; height: 3rem; border-radius: 0.375rem; object-fit: cover; flex-shrink: 0; }
    .player-main { min-width: 0; flex: 1; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .title { font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .controls { display: flex; flex-shrink: 0; }
    .controls button { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; }
    .scrub-row { display: flex; align-items: center; gap: 0.5rem; }
    .time { width: 2rem; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .time.end { text-align: right; }
    input[type="range"].scrub {
      -webkit-appearance: none; appearance: none; width: 100%; height: 1.25rem; margin: 0; background: transparent; cursor: pointer;
    }
    input[type="range"].scrub::-webkit-slider-runnable-track {
      height: 2px; border-radius: 999px;
      background: linear-gradient(to right, var(--fg) var(--pct, 0%), color-mix(in oklab, var(--fg) 28%, transparent) var(--pct, 0%));
    }
    input[type="range"].scrub::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border: 0; border-radius: 999px; background: var(--fg);
    }
    input[type="range"].scrub::-moz-range-track { height: 2px; border: 0; border-radius: 999px; background: color-mix(in oklab, var(--fg) 28%, transparent); }
    input[type="range"].scrub::-moz-range-progress { height: 2px; background: var(--fg); }
    input[type="range"].scrub::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 999px; background: var(--fg); }
    .roblox { min-height: 2.75rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 500; }
    .icon { width: 0.875rem; height: 0.875rem; }
    .icon-sm { width: 1rem; height: 1rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .rise { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .d2 { animation-delay: 90ms; } .d3 { animation-delay: 160ms; } .d4 { animation-delay: 230ms; }
    @media (min-width: 640px) {
      .meta { flex-direction: row; align-items: center; gap: 0.5rem; padding-top: 0.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise, .mark { animation: none; }
      .bg { transform: scale(1.08); }
    }
  </style>
</head>

    ];
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const playIcon = document.getElementById("play-icon");
    const titleEl = document.getElementById("title");
    const coverEl = document.getElementById("cover");
    const timeEl = document.getElementById("time");
    const durEl = document.getElementById("dur");
    const scrub = document.getElementById("scrub");
    let index = 0;
    let entered = false;
    audio.volume = 0.4;

    function fmt(s) {
      if (!Number.isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    }
    function setIcon(playing) {
      playIcon.innerHTML = playing
        ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
      playBtn.setAttribute("aria-label", playing ? "Pause" : "Abspielen");
    }
    function paint() {
      const t = tracks[index];
      titleEl.textContent = t.title;
      titleEl.href = t.href;
      coverEl.src = t.cover;
      timeEl.textContent = "0:00";
      durEl.textContent = t.src ? "0:00" : "—";
      scrub.value = 0;
      scrub.max = 0;
      scrub.disabled = !t.src;
      scrub.style.setProperty("--pct", "0%");
    }
    function load(i, autoplay) {
      index = (i + tracks.length) % tracks.length;
      const t = tracks[index];
      paint();
      if (!t.src) {
        audio.pause();
        audio.removeAttribute("src");
        setIcon(false);
        if (autoplay) window.open(t.href, "_blank", "noopener");
        return;
      }
      audio.src = t.src;
      if (autoplay) audio.play().catch(function () { setIcon(false); });
    }
    document.getElementById("enter").addEventListener("click", function () {
      entered = true;
      document.querySelector(".bg").hidden = false;
      document.getElementById("enter").hidden = true;
      document.getElementById("sheet").hidden = false;
      load(0, true);
    });
    playBtn.addEventListener("click", function () {
      const t = tracks[index];
      if (!t.src) { window.open(t.href, "_blank", "noopener"); return; }
      if (audio.paused) audio.play().catch(function () {});
      else audio.pause();
    });
    document.getElementById("prev").addEventListener("click", function () { load(index - 1, !audio.paused); });
    document.getElementById("next").addEventListener("click", function () { load(index + 1, !audio.paused); });
    audio.addEventListener("timeupdate", function () {
      timeEl.textContent = fmt(audio.currentTime);
      if (audio.duration) {
        scrub.value = audio.currentTime;
        scrub.style.setProperty("--pct", (audio.currentTime / audio.duration) * 100 + "%");
      }
    });
    audio.addEventListener("loadedmetadata", function () {
      scrub.max = audio.duration;
      durEl.textContent = fmt(audio.duration);
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { setIcon(false); });
    audio.addEventListener("ended", function () { load(index + 1, true); });
    scrub.addEventListener("input", function () {
      if (!tracks[index].src) return;
      audio.currentTime = Number(scrub.value);
      timeEl.textContent = fmt(audio.currentTime);
    });
    window.addEventListener("keydown", function (e) {
      if (!entered || e.code !== "Space") return;
      if (e.target instanceof HTMLInputElement) return;
      e.preventDefault();
      playBtn.click();
    });
    try {
      const increment = sessionStorage.getItem("colin-db-view") !== "1";
      fetch("/api/views", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ increment: increment })
      }).then(function (response) {
        if (!response.ok) return;
        return response.json();
      }).then(function (data) {
        if (!data || !Number.isFinite(data.count)) return;
        if (increment) sessionStorage.setItem("colin-db-view", "1");
        document.getElementById("views").textContent = String(data.count);
      }).catch(function () {});
    } catch (e) {}
  </script>
