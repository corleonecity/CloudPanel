<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitstand · Colin's Community</title>
  <style>
    :root { color-scheme: dark; --bg:#101411; --panel:#171c19; --line:#2c3530; --fg:#e7eee9; --muted:#93a199; --lime:#d6ff4a; --ink:#152006; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 Outfit, ui-sans-serif, system-ui, sans-serif; }
    header, main { width:min(920px, calc(100% - 32px)); margin:0 auto; }
    header { padding:28px 0 8px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { font-family: Georgia, serif; font-size:40px; line-height:1; margin:0; font-weight:560; }
    p { color:var(--muted); }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    button, .file { min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:0 14px; cursor:pointer; }
    button.primary { background:var(--lime); color:var(--ink); border-color:transparent; font-weight:600; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
    label { display:block; margin:12px 0; }
    span { display:block; color:var(--muted); font-size:14px; margin-bottom:6px; }
    input, textarea { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:10px; padding:10px 12px; font:inherit; }
    textarea { min-height:72px; resize:vertical; }
    .preview { border-left:4px solid var(--lime); padding:12px 14px; background:#121714; border-radius:0 12px 12px 0; white-space:pre-wrap; }
    pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border-radius:10px; padding:12px; max-height:280px; overflow:auto; }
    .ok { color:var(--lime); }
  </style>
</head>
<body>
  <header>
    <div>
      <p>GitHub-Dashboard · nur in diesem Browser gespeichert</p>
      <h1>Leitstand</h1>
    </div>
    <div class="row">
      <button class="primary" id="save">Speichern</button>
      <button id="copy">Skript kopieren</button>
      <button id="down">cloudflare-worker.js</button>
    </div>
  </header>
  <main>
    <section>
      <label><span>Servername</span><input id="serverName"></label>
      <label><span>Einleitung über den Regeln</span><textarea id="rulesIntro"></textarea></label>
      <label><span>Regeln, eine pro Zeile</span><textarea id="rules" style="min-height:220px"></textarea></label>
      <label><span>Titel der zweiten Nachricht</span><input id="stepsTitle"></label>
      <label><span>Schritte, eine pro Zeile</span><textarea id="steps"></textarea></label>
      <label><span>Text auf dem Haken-Button</span><input id="buttonLabel"></label>
      <label><span>Antwort, wenn der Haken die Rolle setzt</span><input id="acceptReply"></label>
      <p id="status" class="ok"></p>
    </section>
    <section>
      <p>Vorschau #server-regeln</p>
      <div class="preview" id="preview"></div>
    </section>
    <section>
      <p>Cloudflare-Skript aus diesen Texten. Secrets bleiben außerhalb: DISCORD_TOKEN, TURSO_TOKEN, VERIFIED_ROLE_ID.</p>
      <pre id="script"></pre>
    </section>
  </main>
  <script>
    const KEY = "leitstand-texte-v1";
    const base = {
      serverName: "Colin's Community",
      rulesIntro: "Wir werden stets die Nutzungsbedingungen (ToS) und die Community-Richtlinien von Discord durchsetzen.",
      rules: "Die Einhaltung der allgemeinen Netiquette ist unerlässlich. Behandle andere Mitglieder des Servers mit Respekt und Freundlichkeit.\nBelästigung, Mobbing, Diskriminierung oder Drohungen werden nicht toleriert. Jeder Nutzer sollte sich sicher und wohl fühlen.\nSpamming ist verboten. Sende keine wiederholten, unnötigen oder unerwünschten Nachrichten.\nWerbung für andere Discord-Server oder externe Plattformen ist nur mit Erlaubnis eines Administrators gestattet.\nAnstößige, rassistische, sexistische oder pornografische Inhalte sind streng verboten.\nDas Teilen persönlicher Informationen anderer Nutzer ohne deren Zustimmung ist nicht erlaubt.\nDas Verbreiten von Viren, schadhafter Software oder betrügerischen Inhalten ist streng verboten. Dies schließt das Senden von Phishing-Links ein.\nDas Erstellen mehrerer Konten, um Strafen zu umgehen oder den Server zu stören, ist nicht gestattet.\nDiskussionen über politische oder religiöse Themen sollten respektvoll geführt werden. Jeder Nutzer hat das Recht auf seine eigene Meinung.\nBei Verstößen gegen diese Regeln behalten sich die Administratoren das Recht vor, geeignete Maßnahmen zu ergreifen, einschließlich des Entzugs von Chat- oder Serverrechten.\nIn der Regel zu Auto-Rollen setzen wir die Wahrheit strikt durch. Wer mehr Rollen zugewiesen bekommt als erlaubt oder die Anforderungen nicht erfüllt, wird entsprechend bestraft.",
      stepsTitle: "wie kann ich schreiben?",
      steps: "Akzeptiere die Regeln unter #server-regeln und drücke den Button.\nGehe zu #verifizieren-hub, der hinzugefügt wird, nachdem du die Regeln akzeptiert hast.\nVerifiziere dich: drücke einfach den Button.\nGehe zum Kanal #wähle-deine-spiele und wähle dein Spiel aus. Danach siehst du den Kanal für dein Spiel.",
      buttonLabel: "Regeln akzeptieren",
      acceptReply: "Regeln akzeptiert. Die Rolle ist drauf."
    };
    const fields = ["serverName", "rulesIntro", "rules", "stepsTitle", "steps", "buttonLabel", "acceptReply"];
    function read() {
      const data = {};
      for (const id of fields) data[id] = document.getElementById(id).value;
      return data;
    }
    function write(data) {
      for (const id of fields) document.getElementById(id).value = data[id] || "";
    }
    function lines(text) { return text.split(/\n/).map((x) => x.trim()).filter(Boolean); }
    function worker(data) {
      const config = {
        serverName: data.serverName,
        rulesIntro: data.rulesIntro,
        links: ["https://discord.com/terms", "https://discord.com/guidelines"],
        rules: lines(data.rules),
        stepsTitle: data.stepsTitle,
        steps: lines(data.steps),
        buttonLabel: data.buttonLabel || "Regeln akzeptieren",
        acceptReply: data.acceptReply || "Regeln akzeptiert. Die Rolle ist drauf."
      };
      return `const CONFIG = ${JSON.stringify(config, null, 2)};

function hexToBytes(hex) {
  const clean = String(hex || "").trim();
  if (clean.length % 2 !== 0) return new Uint8Array();
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.slice(i * 2, i * 2 + 2), 16);
  return out;
}
async function verifyRequest(request, raw, env) {
  const signature = request.headers.get("x-signature-ed25519");
  const timestamp = request.headers.get("x-signature-timestamp");
  if (!signature || !timestamp || !env.DISCORD_PUBLIC_KEY) return false;
  try {
    const key = await crypto.subtle.importKey("raw", hexToBytes(env.DISCORD_PUBLIC_KEY), { name: "Ed25519" }, false, ["verify"]);
    return await crypto.subtle.verify("Ed25519", key, hexToBytes(signature), new TextEncoder().encode(timestamp + raw));
  } catch { return false; }
}
function message(data, ephemeral) {
  if (ephemeral) data.flags = 64;
  return Response.json({ type: 4, data });
}
function embed(title, description) {
  return [{ title: String(title).slice(0, 256), description: String(description || "—").slice(0, 4096), color: 0x57f287 }];
}
function userOf(body) {
  const user = body.member?.user || body.user || {};
  return { id: user.id || "unknown", name: user.global_name || user.username || "Mitglied" };
}
async function turso(env, sql, args) {
  if (!env.TURSO_URL || !env.TURSO_TOKEN) return { skipped: true };
  const url = String(env.TURSO_URL).trim().replace(/\\/$/, "").replace(/^libsql:\\/\\//, "https://").replace(/^turso:\\/\\//, "https://");
  const res = await fetch(url + "/v2/pipeline", {
    method: "POST",
    headers: { authorization: "Bearer " + env.TURSO_TOKEN, "content-type": "application/json" },
    body: JSON.stringify({ requests: [{ type: "execute", stmt: { sql, args: (args || []).map((value) => ({ type: "text", value: String(value) })) } }, { type: "close" }] }),
    signal: AbortSignal.timeout(2500)
  });
  if (!res.ok) return { error: true };
  return await res.json();
}
async function acceptRules(env, body) {
  const user = userOf(body);
  await turso(env, "INSERT INTO verifications (user_id, username, verified_at) VALUES (?, ?, datetime('now')) ON CONFLICT(user_id) DO UPDATE SET username = excluded.username, verified_at = excluded.verified_at", [user.id, user.name]);
  if (!env.DISCORD_TOKEN || !body.guild_id || !env.VERIFIED_ROLE_ID) return CONFIG.acceptReply + " Rolle noch nicht gesetzt: Token oder Rollen-ID fehlt.";
  const res = await fetch("https://discord.com/api/v10/guilds/" + body.guild_id + "/members/" + user.id + "/roles/" + env.VERIFIED_ROLE_ID, { method: "PUT", headers: { authorization: "Bot " + env.DISCORD_TOKEN } });
  return res.ok || res.status === 204 ? CONFIG.acceptReply : "Gespeichert, Discord hat die Rolle nicht gesetzt. Die Rolle muss unter der Bot-Rolle stehen.";
}
function rulesPayload() {
  const text = [CONFIG.rulesIntro, "", ...CONFIG.links, "", ...CONFIG.rules.map((rule, i) => (i + 1) + ". " + rule)].join("\\n");
  return { embeds: embed("Regeln", text), components: [{ type: 1, components: [{ type: 2, style: 3, label: CONFIG.buttonLabel, custom_id: "rules:accept" }] }] };
}
export default {
  async fetch(request, env) {
    if (request.method === "GET") return new Response(CONFIG.serverName + " Bot ist erreichbar.", { status: 200 });
    if (request.method !== "POST") return new Response("method", { status: 405 });
    const raw = await request.text();
    if (!(await verifyRequest(request, raw, env))) return new Response("invalid request signature", { status: 401 });
    let body; try { body = JSON.parse(raw); } catch { return new Response("bad json", { status: 400 }); }
    if (body.type === 1) return Response.json({ type: 1 });
    if (body.type === 3 && body.data?.custom_id === "rules:accept") return message({ content: await acceptRules(env, body) }, true);
    if (body.type !== 2) return Response.json({ type: 1 });
    const name = body.data?.name;
    if (name === "regeln") return message(rulesPayload(), false);
    if (name === "schreiben") return message({ embeds: embed(CONFIG.stepsTitle, CONFIG.steps.map((step, i) => (i + 1) + ". " + step).join("\\n")) }, false);
    if (name === "verify") return message({ content: await acceptRules(env, body) }, true);
    if (name === "hilfe") return message({ content: "/regeln  /schreiben  /verify" }, true);
    return message({ content: "Unbekannter Befehl." }, true);
  }
};
`;
    }
    function render() {
      const data = read();
      const rules = lines(data.rules).map((rule, i) => (i + 1) + ". " + rule).join("\n\n");
      document.getElementById("preview").textContent = data.rulesIntro + "\n\nhttps://discord.com/terms\nhttps://discord.com/guidelines\n\n" + rules + "\n\n[ " + (data.buttonLabel || "Regeln akzeptieren") + " ]";
      document.getElementById("script").textContent = worker(data);
    }
    write(JSON.parse(localStorage.getItem(KEY) || "null") || base);
    render();
    document.querySelector("main").addEventListener("input", render);
    document.getElementById("save").onclick = () => {
      localStorage.setItem(KEY, JSON.stringify(read()));
      document.getElementById("status").textContent = "Gespeichert in diesem Browser.";
    };
    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(worker(read()));
      document.getElementById("status").textContent = "Skript kopiert. In Cloudflare als Worker einfügen.";
    };
    document.getElementById("down").onclick = () => {
      const blob = new Blob([worker(read())], { type: "text/javascript" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cloudflare-worker.js";
      a.click();
    };
  </script>
</body>
</html>
