<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Corleone City - Karte</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

<style>
html, body {
  height: 100%;
  margin: 0;
}

#map {
  height: 100vh;
  width: 100%;
}

#searchBox {
  position: absolute;
  top: 10px;
  left: 50px;
  z-index: 1000;
  width: 260px;
}

.title {
  position: absolute;
  top: 10px;
  right: 20px;
  z-index: 1000;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 6px 12px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="title">Corleone City Karte</div>

<input id="searchBox" class="form-control" placeholder="Suche Ort...">

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🔥 Fehler sichtbar machen
window.onerror = function(msg, url, line) {
  console.error("JS Fehler:", msg, "Zeile:", line);
};

// 🌍 Karte starten
const map = L.map('map').setView([51.0, 10.5], 6);

// ✅ Funktionierende Tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 📍 Demo POIs (ersetzt Backend)
const pois = [
  {name: "Berlin", lat: 52.52, lng: 13.405, kategorie: "Stadt"},
  {name: "Erfurt", lat: 50.9848, lng: 11.0299, kategorie: "Stadt"},
  {name: "Hamburg", lat: 53.5511, lng: 9.9937, kategorie: "Stadt"},
  {name: "München", lat: 48.1351, lng: 11.5820, kategorie: "Stadt"},
  {name: "Park Beispiel", lat: 51.2, lng: 10.8, kategorie: "Park"}
];

let markers = [];

// Marker erstellen
pois.forEach(p => {
  const marker = L.marker([p.lat, p.lng])
    .addTo(map)
    .bindPopup("<b>" + p.name + "</b><br>" + p.kategorie);

  markers.push({marker, data: p});
});

// 🔍 Suche
const searchBox = document.getElementById("searchBox");

searchBox.addEventListener("input", function() {
  const val = this.value.toLowerCase();

  markers.forEach(m => {
    if (m.data.name.toLowerCase().includes(val)) {
      map.setView(m.marker.getLatLng(), 10);
      m.marker.openPopup();
    }
  });
});

// ➕ Marker per Klick hinzufügen (wie Admin light)
map.on("click", function(e) {
  const name = prompt("Name des Ortes?");
  if (!name) return;

  const marker = L.marker(e.latlng)
    .addTo(map)
    .bindPopup(name)
    .openPopup();

  markers.push({
    marker,
    data: {name, lat: e.latlng.lat, lng: e.latlng.lng}
  });
});

</script>

</body>
</html>
