<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Corleone City - KARTE</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
  <!-- FontAwesome für Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      position: relative;
      height: 100vh;
      width: 100vw;
    }
    #map {
      position: absolute;
      top: 56px; /* Höhe der Bootstrap-Navbar */
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      /* height wird durch top/bottom geregelt */
      background: #84B2CE;
    }
    .bezirk-label {
      text-align: center;
      pointer-events: none;
    }
    .herz-overlay {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 9999;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      padding: 8px 18px 8px 14px;
      font-size: 1.05em;
      color: #c00;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #eee;
      pointer-events: none;
      user-select: none;
    }
    .herz-emoji {
      font-size: 1.3em;
      margin-right: 2px;
    }
    /* CSS für Layer-Kategorien */
    .layercat {
      font-weight: bold;
      color: #333;
      margin: 6px 0 2px 0;
      padding-left: 2px;
      font-size: 1em;
    }
    .tip-label {
      display: inline-block;
      position: relative;
      background: #fff;
      border-radius: 6px;
      padding: 2px 10px 2px 8px;
      font-weight: bold;
      color: #c00;
      font-size: 1em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      border: 1px solid #c00;
      text-shadow: 1px 1px 4px #fff,1px 1px 8px #000;
    }
    .tip-label .tip-arrow {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -8px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #c00;
    }
    .highlight-poi-marker {
      box-shadow: 0 0 0 6px #ffe066, 0 0 18px 10px #ffd70099;
      border-radius: 10px;
      background: #fffbe6;
      transition: box-shadow 0.2s;
      z-index: 9999;
    }
    .highlight-strasse-polyline {
      stroke: #ffd700 !important;
      stroke-width: 12 !important;
      filter: drop-shadow(0 0 8px #ffd700cc);
    }
  </style>
</head>
<body>
  <!-- Bootstrap Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Corleone City - KARTE</span>
      <form class="d-flex me-3" style="width:260px;" autocomplete="off" onsubmit="return false;">
        <input id="searchInput" class="form-control form-control-sm" type="search" placeholder="Suche POI/Straße..." aria-label="Suche" style="width:100%;">
        <div id="searchResults" class="dropdown-menu show" style="display:none;max-height:260px;overflow:auto;position:absolute;z-index:2000;width:100%;top:38px;"></div>
      </form>
      <div class="d-flex ms-auto align-items-center">
        <span id="adminStatus" class="navbar-text me-3">Nicht eingeloggt</span>
        <button id="adminLoginBtn" class="btn btn-outline-light btn-sm me-2" data-bs-toggle="modal" data-bs-target="#adminLoginModal">Admin-Login</button>
        <button id="adminLogoutBtn" class="btn btn-outline-warning btn-sm d-none">Logout</button>
      </div>
    </div>
  </nav>
  <div id="map"></div>
  <div class="herz-overlay">Mit <span class="herz-emoji">❤️</span>von Lukas Birkenfeld erstellt</div>  
  <div id="loginBox" class="modal fade" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Verstecke Punkte anzeigen</h5> 
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button> 
        </div>
        <div class="modal-body">
          <form id="loginForm"> 
            <label class="form-label">Passwort:
              <input type="password" id="pw" autocomplete="off" class="form-control my-2" />
            </label>
            <div id="loginMsg" class="text-danger small mb-2"></div>
            <div class="form-text mb-2">Die jeweilige Fraktion ist für die Dokumentation und Sicherstellung des Passworts selbst verantwortlich!</div>
            <button type="submit" class="btn btn-primary w-100">Freischalten</button>
          </form>
        </div>
      </div>
    </div> 
  </div>
  <!-- Modal für Bezirk-Bearbeitung -->
  <div id="bezirkModal" class="modal fade" tabindex="-1" aria-labelledby="bezirkModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bezirkModalLabel">Bezirk bearbeiten</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
        </div>
        <div class="modal-body">
          <form id="bezirkForm">
            <div class="mb-3">
              <label for="bezirkName" class="form-label">Name</label>
              <input type="text" class="form-control" id="bezirkName" required>
            </div>
            <div class="mb-3">
              <label for="bezirkColor" class="form-label">Farbe</label>
              <input type="color" class="form-control form-control-color" id="bezirkColor" value="#007bff" title="Wählen Sie eine Farbe für den Bezirk">
            </div>
            <div class="mb-3">
              <label for="bezirkLabelColor" class="form-label">Label-Farbe</label>
              <input type="color" class="form-control form-control-color" id="bezirkLabelColor" value="#ffffff" title="Wählen Sie eine Farbe für das Label">
            </div>
            <button type="submit" class="btn btn-primary w-100">Speichern</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- Admin-Login Modal -->
  <div id="adminLoginModal" class="modal fade" tabindex="-1" aria-labelledby="adminLoginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="adminLoginModalLabel">Admin-Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
        </div>
        <div class="modal-body">
          <form id="adminLoginForm">
            <div class="mb-3">
              <label for="adminUser" class="form-label">Benutzername</label>
              <input type="text" class="form-control" id="adminUser" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="adminPw" class="form-label">Passwort</label>
              <input type="password" class="form-control" id="adminPw" required autocomplete="current-password">
            </div>
            <div id="adminLoginMsg" class="text-danger small mb-2"></div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal für Straßen-Bearbeitung -->
  <div id="strasseModal" class="modal fade" tabindex="-1" aria-labelledby="strasseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="strasseModalLabel">Straße bearbeiten</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
        </div>
        <div class="modal-body">
          <form id="strasseForm">
            <div class="mb-3">
              <label for="strasseName" class="form-label">Name</label>
              <input type="text" class="form-control" id="strasseName" required>
            </div>
            <div class="mb-3">
              <label for="strasseColor" class="form-label">Farbe</label>
              <input type="color" class="form-control form-control-color" id="strasseColor" value="#444" title="Wählen Sie eine Farbe für die Straße">
            </div>
            <div class="mb-3">
              <label for="strasseLabelColor" class="form-label">Label-Farbe</label>
              <input type="color" class="form-control form-control-color" id="strasseLabelColor" value="#ffffff" title="Wählen Sie eine Farbe für das Label">
            </div>
            <div class="mb-3">
              <label for="strasseKategorie" class="form-label">Kategorie</label>
              <input type="text" class="form-control" id="strasseKategorie">
            </div>
            <button type="submit" class="btn btn-primary w-100">Speichern</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal für POI-Bearbeitung/Anlegen -->
  <div id="poiModal" class="modal fade" tabindex="-1" aria-labelledby="poiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="poiModalLabel">POI bearbeiten/anlegen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
        </div>
        <div class="modal-body">
          <form id="poiForm">
            <div class="mb-3">
              <label for="poiName" class="form-label">Name</label>
              <input type="text" class="form-control" id="poiName" required>
            </div>
            <div class="mb-3">
              <label for="poiKategorie" class="form-label">Kategorie</label>
              <input type="text" class="form-control" id="poiKategorie" list="poiKategorieList" required>
              <datalist id="poiKategorieList"></datalist>
            </div>
            <div class="mb-3">
              <label for="poiIcon" class="form-label">Icon</label>
              <div class="input-group">
                <input type="text" class="form-control" id="poiIcon" list="poiIconList" placeholder="z.B. fa-solid fa-tree">
                <datalist id="poiIconList">
                  <option value="fa-solid fa-location-dot">📍 Standard</option>
                  <option value="fa-solid fa-car">🚗 Auto</option>
                  <option value="fa-solid fa-building">🏢 Gebäude</option>
                  <option value="fa-solid fa-utensils">🍽️ Restaurant</option>
                  <option value="fa-solid fa-hospital">🏥 Krankenhaus</option>
                  <option value="fa-solid fa-gas-pump">⛽ Tankstelle</option>
                  <option value="fa-solid fa-store">🏪 Laden</option>
                  <option value="fa-solid fa-tree">🌳 Park</option>
                  <option value="fa-solid fa-user-secret">🕵️ Geheim</option>
                  <option value="fa-solid fa-star">⭐ Besonderes</option>
                </datalist>
                <span class="input-group-text" id="poiIconPreview"><i class="fa-solid fa-location-dot"></i></span>
              </div>
            </div>
            <div class="mb-3">
              <label for="poiIconColor" class="form-label">Icon-Farbe</label>
              <input type="color" class="form-control form-control-color" id="poiIconColor" value="#c00" title="Wählen Sie eine Farbe für das Icon">
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="poiProtected"> 
              <label class="form-check-label" for="poiProtected">Geschützt (Passwort benötigt)</label>
            </div>
            <div class="mb-3" id="poiPwDiv" style="display:none;">
              <label for="poiPw" class="form-label">Passwort für Kategorie (nur beim Anlegen/Ändern)</label>
              <input type="password" class="form-control" id="poiPw">
            </div>
            <button type="submit" class="btn btn-primary w-100">Speichern</button>
          </form>
          <div id="poiDeleteDiv" class="mt-3" style="display:none;">
            <button id="poiDeleteBtn" class="btn btn-danger w-100">Löschen</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script> 
    // Definiere einmal die Bounds im Game-Koordinatensystem
    const bounds = [[-3000, -3000], [3000, 3000]];

    // Initialisiere die Karte mit Center & Zoom
    const map = L.map('map', { 
      crs: L.CRS.Simple, 
      center: [-170, 125],
      zoom: 5,         // <-- von 2 auf 4 hochsetzen
      minZoom: 2,
      maxZoom: 5,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0
    });
    

    L.tileLayer('tiles/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 5,      // deckungsgleich
      noWrap: true,
      bounds: bounds
    }).addTo(map);

    // LayerGroups für POIs
    const poiLayerGroups = {};
    const allMarkers = [];

    // Bezirke als Polygon-LayerGroup
    const bezirkeLayer = new L.FeatureGroup().addTo(map);
    // --- Straßenverwaltung ---
    let strassenLayer = new L.FeatureGroup().addTo(map);
    let strassenEinzellayer = {};
    let strassenData = [];
 
    // Hilfsfunktion: Zufällige, aber kontrastreiche Farben generieren
    function randomColor() {
      // HSL: Sättigung und Helligkeit fest, nur Farbton random
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 70%, 45%)`;
    }
    function contrastingColor(bgColor) {
      // bgColor als hsl(x, y%, z%) oder hex
      if (!bgColor) return '#fff';
      if (bgColor.startsWith('#')) {
        // Hex nach HSL umrechnen
        let r = parseInt(bgColor.substr(1,2),16), g = parseInt(bgColor.substr(3,2),16), b = parseInt(bgColor.substr(5,2),16);
        r /= 255; g /= 255; b /= 255;
        let max = Math.max(r,g,b), min = Math.min(r,g,b);
        let l = (max+min)/2;
        return l > 0.5 ? '#222' : '#fff';
      }
      // HSL: Sättigung und Helligkeit extrahieren
      const match = bgColor.match(/hsl\(\d+, *\d+%, *(\d+)%\)/);
      if (match) {
        const l = parseInt(match[1]);
        return l > 50 ? '#222' : '#fff';
      }
      return '#fff';
    }

    // --- Modal für Bezirk-Bearbeitung ---
    let bezirkModal, bezirkModalLayer;
    function showBezirkModal(layer, isNew) {
      bezirkModalLayer = layer;
      let name = isNew ? '' : (layer.getPopup() ? layer.getPopup().getContent() : '');
      let color = isNew ? randomColor() : (layer.options.color || randomColor());
      let labelColor = contrastingColor(color);
      document.getElementById('bezirkName').value = name;
      document.getElementById('bezirkColor').value = color;
      document.getElementById('bezirkLabelColor').value = labelColor;
      if (!bezirkModal) bezirkModal = new bootstrap.Modal(document.getElementById('bezirkModal'));
      bezirkModal.show();
    }

    // Bezirke aus Datenbank laden
    function ladeBezirke() {
      fetch('bezirke.php')
        .then(res => res.json())
        .then(bezirke => {
          bezirkeLayer.clearLayers();
          // Kategorien gruppieren
          const kategorien = {};
          bezirke.forEach(b => {
            const kat = b.kategorie || 'Bezirke';
            if (!kategorien[kat]) kategorien[kat] = [];
            kategorien[kat].push(b);
          });
          // Für LayerControl: LayerGroups pro Bezirk (mit Kategorie-Präfix)
          window.bezirkEinzellayer = {};
          Object.entries(kategorien).forEach(([kat, bezirkeInKat]) => {
            bezirkeInKat.forEach(b => {
              const polygon = L.polygon(b.coords, {
                color: b.color,
                fillOpacity: 0.2,
                weight: 2
              }).bindPopup(b.name);
              polygon._bezirkId = b.id;
              polygon._bezirkLabelColor = b.labelColor || contrastingColor(b.color);
              // LayerGroup für LayerControl: Kategorie / Bezirk
              const group = L.layerGroup([polygon]);
              // Label mittig anzeigen
              const latlngs = b.coords;
              const center = L.polygon(latlngs).getBounds().getCenter();
              const label = L.marker(center, {
                icon: L.divIcon({
                  className: 'bezirk-label',
                  html: `<div style=\"font-weight:bold;color:${polygon._bezirkLabelColor};font-size:1.1em;text-shadow:1px 1px 4px #fff,1px 1px 8px #000;\">${b.name}</div>`,
                  iconSize: [100, 24],
                  iconAnchor: [50, 12]
                }),
                interactive: false
              });
              group.addLayer(label);
              window.bezirkEinzellayer[`${kat} / ${b.name}`] = group;
              // Nur LayerGroup addTo map, nicht Polygon/Label direkt:
              group.addTo(map);
            });
          });
          updateLayerControl();
          enableBezirkDirectEdit();
        });
    }
    ladeBezirke();  

    // Direktbearbeitung für Bezirke
    function enableBezirkDirectEdit() {
      if (!window.bezirkEinzellayer) return;
      Object.values(window.bezirkEinzellayer).forEach(group => {
        group.eachLayer(function(l) {
          if (l instanceof L.Polygon) {
            l.on('click', function(e) {
              if (isAdmin) {
                L.DomEvent.stopPropagation(e);
                showBezirkModal(l, false);
              }
            });
          }
        });
      });
    }

    // LayerControl aktualisieren (Bezirke standardmäßig aktiv)
    function updateLayerControl() {
      if (window.poiLayerControl) {
        map.removeControl(window.poiLayerControl);
      }
      // Layer sortieren: 'Bezirke' und 'Straßen' zuerst, dann alphabetisch
      const overlayLayers = {};
      // --- Bezirke ---
      if (window.bezirkEinzellayer) {
        const kategorien = {};
        Object.keys(window.bezirkEinzellayer).forEach(key => {
          const [kat] = key.split(' / ');
          if (!kategorien[kat]) kategorien[kat] = [];
          kategorien[kat].push(key);
        });
        const sortedKats = Object.keys(kategorien).sort((a, b) => {
          if (a === 'Bezirke') return -1;
          if (b === 'Bezirke') return 1;
          return a.localeCompare(b);
        });
        sortedKats.forEach(kat => {
          kategorien[kat].sort((a, b) => a.localeCompare(b));
          kategorien[kat].forEach(key => {
            overlayLayers[key] = window.bezirkEinzellayer[key];
          });
        });
      }
      // --- Straßen ---
      if (window.strassenEinzellayer) {
        const kategorien = {};
        Object.keys(window.strassenEinzellayer).forEach(key => {
          const [kat] = key.split(' / ');
          if (!kategorien[kat]) kategorien[kat] = [];
          kategorien[kat].push(key);
        });
        // 'Straßen' zuerst, dann alphabetisch
        const sortedKats = Object.keys(kategorien).sort((a, b) => {
          if (a === 'Straßen') return -1;
          if (b === 'Straßen') return 1;
          return a.localeCompare(b);
        });
        sortedKats.forEach(kat => {
          kategorien[kat].sort((a, b) => a.localeCompare(b));
          kategorien[kat].forEach(key => {
            overlayLayers[key] = window.strassenEinzellayer[key];
          });
        });
      }
      // POIs anhängen
      Object.assign(overlayLayers, poiLayerGroups);
      window.poiLayerControl = L.control.layers(null, overlayLayers, {collapsed:false, position:'topright'}).addTo(map);

      // --- Bezirke: Alle ein-/ausblenden Button ---
      setTimeout(() => {
        const overlaysDiv = document.querySelector('.leaflet-control-layers-overlays');
        if (!overlaysDiv) return;
        // Button nur einmal einfügen
        if (!document.getElementById('bezirkeToggleBtn')) {
          const btn = document.createElement('button');
          btn.id = 'bezirkeToggleBtn';
          btn.className = 'btn btn-outline-secondary btn-sm mb-2';
          btn.style.width = '100%';
          btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Bezirke ausblenden';
          btn.dataset.state = 'visible';
          btn.onclick = function() {
            const labels = Array.from(overlaysDiv.querySelectorAll('label'));
            let changed = false;
            labels.forEach(label => {
              const text = label.innerText.trim();
              if (text.match(/^Bezirke\s*\//)) {
                const cb = label.querySelector('input[type="checkbox"]');
                if (cb) {
                  if (btn.dataset.state === 'visible') {
                    if (cb.checked) { cb.click(); changed = true; }
                  } else {
                    if (!cb.checked) { cb.click(); changed = true; }
                  }
                }
              }
            });
            if (btn.dataset.state === 'visible') {
              btn.innerHTML = '<i class="fa-solid fa-eye"></i> Bezirke einblenden';
              btn.dataset.state = 'hidden';
            } else {
              btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Bezirke ausblenden';
              btn.dataset.state = 'visible';
            }
          };
          overlaysDiv.parentElement.insertBefore(btn, overlaysDiv);
        }
        // --- Intercept für geschützte POI-Kategorien ---
        // Finde alle POI-Layer-Checkboxen
        Object.keys(poiLayerGroups).forEach(cat => {
          // Prüfe, ob Kategorie geschützt ist (aus allPOIData)
          const isProtected = allPOIData.some(p => p.kategorie===cat && p.protected==1);
          if (isProtected && !isPoiCategoryUnlocked(cat)) {
            // Checkbox für diese Kategorie deaktivieren und Klick abfangen
            labels.forEach(label => {
              if (label.innerText.trim() === cat) {
                const cb = label.querySelector('input[type="checkbox"]');
                if (cb) {
                  cb.checked = false;
                  cb.disabled = false;
                  cb.onclick = function(e) {
                    e.preventDefault();
                    showPoiCategoryUnlockModal(cat);
                    return false;
                  };
                  label.style.opacity = 0.7;
                  label.title = 'Geschützte Kategorie – Passwort nötig';
                }
              }
            });
          }
        });
      }, 50);
    }

    let allPOIData = [];
    // POIs laden und Marker setzen
    function ladePOIs() {
      fetch('pois.php')
        .then(res => res.json())
        .then(pois => {
          allPOIData = pois;
          // Vorherige Marker entfernen
          Object.values(poiLayerGroups).forEach(g => map.removeLayer(g));
          Object.keys(poiLayerGroups).forEach(k => delete poiLayerGroups[k]);
          allMarkers.length = 0;

          pois.forEach(poi => {
            // Geschützte POIs nur anzeigen, wenn Kategorie freigeschaltet
            if (poi.protected==1 && !isPoiCategoryUnlocked(poi.kategorie)) return;
            if (!poiLayerGroups[poi.kategorie || 'Öffentlich']) {
              poiLayerGroups[poi.kategorie || 'Öffentlich'] = L.layerGroup().addTo(map);
            }
            // --- FontAwesome Icon als Marker + Name darunter ---
            let iconClass = poi.icon || 'fa-solid fa-location-dot';
            let iconColor = poi.iconColor || '#c00';
            let iconHtml = `<div style='display:flex;flex-direction:column;align-items:center;'>` +

          draw: {
            polygon: isAdmin ? {

    // Straßen aus Datenbank laden
    function ladeStrassen() {
      fetch('strassen.php')
        .then(res => res.json())
        .then(strassen => {
          strassenLayer.clearLayers(); 
          strassenEinzellayer = {};
          strassenData = strassen;
          window.strassenData = strassen; // <-- Fix für Suche
          strassen.forEach(s => {
            const poly = L.polyline(s.coords, {
              color: s.color || '#444',
              weight: 5,
              opacity: 0.8
            }).bindPopup(s.name);
            poly._strasseId = s.id; 
            poly._strasseLabelColor = s.labelColor || '#222';
            // Direktbearbeitung für Admins
            poly.on('click', function(e) {
              if (isAdmin) {
                L.DomEvent.stopPropagation(e);
                showStrasseModal(poly, false);
              }
            });
            // Label am mittleren Punkt der Koordinaten
            let coords = s.coords;
            let midIdx = Math.floor(coords.length / 2);
            let center = coords[midIdx];  
            const label = L.marker(center, { 
              icon: L.divIcon({ 
                className: 'bezirk-label',
                html: `<div class="tip-label" style="background:${s.color};border:1px solid ${s.color};color:${poly._strasseLabelColor};">${s.name}<div class="tip-arrow" style="border-top:10px solid ${s.color};"></div></div>`,
                iconSize: [120, 36],
                iconAnchor: [60, 28]
              }),
              interactive: false
            });
            const group = L.layerGroup([poly, label]);
            strassenEinzellayer[`Straßen / ${s.name}`] = group;
            group.addTo(map);
          });
          updateLayerControl();
        });

    // POI anlegen-Button für Admins (z.B. oben rechts)

      if (!isAdmin) return;
      allMarkers.forEach(marker => {

    // Nach jedem POI-Reload:
    function ladePOIs() {   
      fetch('pois.php')
        .then(res => res.json())
        .then(pois => {   
          allPOIData = pois;
          // Vorherige Marker entfernen
          Object.values(poiLayerGroups).forEach(g => map.removeLayer(g));
          Object.keys(poiLayerGroups).forEach(k => delete poiLayerGroups[k]); 
          allMarkers.length = 0;

          pois.forEach(poi => { 
            // Geschützte POIs nur anzeigen, wenn Kategorie freigeschaltet
            if (poi.protected==1 && !isPoiCategoryUnlocked(poi.kategorie)) return;
            if (!poiLayerGroups[poi.kategorie || 'Öffentlich']) {
              poiLayerGroups[poi.kategorie || 'Öffentlich'] = L.layerGroup().addTo(map);
            }
            // --- FontAwesome Icon als Marker + Name darunter ---
            let iconClass = poi.icon || 'fa-solid fa-location-dot';
            let iconColor = poi.iconColor || '#c00';
            let iconHtml = `<div style='display:flex;flex-direction:column;align-items:center;'>` +
              `<i class='${iconClass}' style='color:${iconColor};font-size:2em;'></i>` +
              `<span style='background:rgba(255,255,255,0.85);color:#222;font-size:0.95em;padding:0 4px;border-radius:3px;margin-top:2px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>${poi.name}</span>` +
              `</div>`;
            let marker = L.marker([parseFloat(poi.x), parseFloat(poi.y)], {
              icon: L.divIcon({
                className: 'fa-marker',
                html: iconHtml,
                iconSize: [90, 48],
                iconAnchor: [45, 44]
              })
            })
            .bindPopup(poi.name + (poi.protected == 1 ? ' <span style="color:red;">(geschützt: '+(poi.kategorie||'')+')</span>' : ''));
            marker.addTo(poiLayerGroups[poi.kategorie || 'Öffentlich']);
            allMarkers.push(marker);
          });

          updateLayerControl();
          enablePoiDirectEdit();
        });

    // Kategorien für Datalist laden (optional Backend-API poi_kategorien.php)
    function ladePoiKategorien() {
      fetch('poi_kategorien.php')
        .then(res => res.json())
        .then(kats => {
          const datalist = document.getElementById('poiKategorieList');

    ladePoiKategorien();
    // --- Suchfeld für POIs und Straßen ---
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let lastPoiHighlight = null;
    let lastStrasseHighlight = null;
    let highlightTimeout = null;

    function clearSearchHighlights() {
      // POI-Highlight entfernen
      if (lastPoiHighlight) {
        const iconDiv = lastPoiHighlight._icon;
        if (iconDiv) iconDiv.classList.remove('highlight-poi-marker');
        lastPoiHighlight = null;
      }
      // Straßen-Highlight entfernen
      if (lastStrasseHighlight) {
        lastStrasseHighlight.setStyle({
          color: lastStrasseHighlight._origColor || lastStrasseHighlight.options.color,
          weight: lastStrasseHighlight._origWeight || lastStrasseHighlight.options.weight,
          opacity: lastStrasseHighlight._origOpacity || lastStrasseHighlight.options.opacity,
          className: ''
        });
        if (lastStrasseHighlight._path) lastStrasseHighlight._path.classList.remove('highlight-strasse-polyline');
        lastStrasseHighlight = null; 
      }
      if (highlightTimeout) {
        clearTimeout(highlightTimeout);
        highlightTimeout = null;
      }
    }

    searchInput.addEventListener('input', function() {
      clearSearchHighlights();
      const val = this.value.trim().toLowerCase();
      searchResults.innerHTML = '';
      if (!val) { searchResults.style.display = 'none'; return; }
      // POIs durchsuchen
      let results = allPOIData.filter(poi => (poi.name||'').toLowerCase().includes(val));
      // Straßen durchsuchen
      let streetResults = (window.strassenData||[]).filter(str => (str.name||'').toLowerCase().includes(val));   
      // Ergebnisse zusammenführen
      let items = [];
      results.forEach(poi => {
        items.push({type:'poi', name: poi.name, kategorie: poi.kategorie, x: poi.x, y: poi.y});
      }); 
      streetResults.forEach(str => items.push({type:'strasse', name:str.name, id:str.id}));
      if (items.length === 0) { searchResults.style.display = 'none'; return; }
      items.slice(0,20).forEach(item => {
        const el = document.createElement('a');
        el.className = 'dropdown-item';
        el.href = '#';
        el.innerHTML = `<span>${item.type==='poi'?'📍':'🛣️'} ${item.name}${item.kategorie?` <span class='text-muted small'>(${item.kategorie})</span>`:''}</span>`;
        el.onclick = function(e) {
          e.preventDefault();
          clearSearchHighlights();
          if(item.type==='poi') {
            // Karte exakt auf den POI zentrieren (Zoom bleibt erhalten)
            map.setView([parseFloat(item.x), parseFloat(item.y)], map.getZoom(), {animate:true});
            // Popup öffnen, falls Marker existiert
            allMarkers.forEach(m => {
              if (m.getLatLng().lat==item.x && m.getLatLng().lng==item.y) {
                m.openPopup();
                // Highlight-Klasse auf das Marker-Icon selbst setzen
                if (m._icon) m._icon.classList.add('highlight-poi-marker');
                lastPoiHighlight = m;
              }
            });
          } else if(item.type==='strasse') {
            // Auf die Straße zoomen und Popup öffnen
            let found = false;
            function highlightPolyline(poly) {
              poly._origColor = poly.options.color;
              poly._origWeight = poly.options.weight;
              poly._origOpacity = poly.options.opacity;
              poly.setStyle({color:'#ffd700',weight:12,opacity:1});
              if (poly._path) poly._path.classList.add('highlight-strasse-polyline');
              lastStrasseHighlight = poly;
            }
            strassenLayer.eachLayer(function(group) {
              if (group instanceof L.LayerGroup) {
                group.eachLayer(function(l) {
                  if (l._strasseId == item.id && l instanceof L.Polyline) {
                    map.fitBounds(l.getBounds(), {maxZoom: 5, animate: true});
                    if (l.getPopup()) l.openPopup();
                    highlightPolyline(l);  
                    found = true;
                  }
                });
              }
            });
            // Fallback: Einzel-Layer durchsuchen
            if (!found && window.strassenEinzellayer) {
              Object.values(window.strassenEinzellayer).forEach(group => {
                group.eachLayer(function(l) {
                  if (l._strasseId == item.id && l instanceof L.Polyline) {
                    // Immer auf die Straße zoomen, auch im Fallback
                    map.fitBounds(l.getBounds(), {maxZoom: 5, animate: true});
                    if (l.getPopup()) l.openPopup();
                    highlightPolyline(l);
                    found = true;
                  }
                });
              });
            }
          }
          searchResults.style.display = 'none';
          searchInput.value = '';
          // Highlight nach 3 Sekunden entfernen
          highlightTimeout = setTimeout(clearSearchHighlights, 3000);
        };
        searchResults.appendChild(el);
      });
      searchResults.style.display = 'block';
    });
    document.addEventListener('click', function(e){
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';

      if (!poiCategoryUnlockModal) {
        // Modal dynamisch erzeugen, falls noch nicht vorhanden
        const modalHtml = `
          <div id="poiCategoryUnlockModal" class="modal fade" tabindex="-1" aria-labelledby="poiCategoryUnlockLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="poiCategoryUnlockLabel">Kategorie freischalten</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-2">Für die Kategorie <b>"<span id="poiCategoryUnlockName"></span>"</b> wird ein Passwort benötigt.</div>
                  <form id="poiCategoryUnlockForm">
                    <input type="password" class="form-control mb-2" id="poiCategoryUnlockPw" placeholder="Passwort">
                    <div id="poiCategoryUnlockMsg" class="text-danger small mb-2"></div>
                    <button type="submit" class="btn btn-primary w-100">Freischalten</button>
                  </form>
                </div>
              </div>
            </div>
          </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        poiCategoryUnlockModal = new bootstrap.Modal(document.getElementById('poiCategoryUnlockModal'));
        document.getElementById('poiCategoryUnlockForm').onsubmit = function(e) {
          e.preventDefault();
          const pw = document.getElementById('poiCategoryUnlockPw').value;
          fetch('pois.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ unlockCategory: poiCategoryToUnlock, pw })
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setPoiCategoryUnlocked(poiCategoryToUnlock, true);
              poiCategoryUnlockModal.hide();
              ladePOIs();
            } else {
              document.getElementById('poiCategoryUnlockMsg').innerText = data.msg || 'Falsches Passwort!';
            }
          });
        };
      }
      document.getElementById('poiCategoryUnlockName').innerText = category;
      document.getElementById('poiCategoryUnlockPw').value = '';
      document.getElementById('poiCategoryUnlockMsg').innerText = '';
      poiCategoryUnlockModal.show();
    }
    function setPoiCategoryUnlocked(category, unlocked) {
      let unlockedCats = JSON.parse(localStorage.getItem('poiCategoryUnlocked')||'{}');
      unlockedCats[category] = !!unlocked; 
      localStorage.setItem('poiCategoryUnlocked', JSON.stringify(unlockedCats));
    }
    function isPoiCategoryUnlocked(category) {
      let unlockedCats = JSON.parse(localStorage.getItem('poiCategoryUnlocked')||'{}');
      return !!unlockedCats[category];
    }
    // --- Admin-Session in localStorage speichern/lesen ---
    function setAdminSessionLocal(isLoggedIn) {
      localStorage.setItem('adminSession', isLoggedIn ? '1' : '0');
    }
    function getAdminSessionLocal() {
      return localStorage.getItem('adminSession') === '1';
    }
    // --- POI-Anlage per Doppelklick für Admins ---
    let poiDblClickHandler = null;
    function enablePoiDblClick() {
      if (poiDblClickHandler) return; // Schon aktiv
      poiDblClickHandler = function(e) {
        if (isAdmin) {
          showPoiModal(null, e.latlng);
        }
      };
      map.on('dblclick', poiDblClickHandler);
    }
    function disablePoiDblClick() {
      if (poiDblClickHandler) {
        map.off('dblclick', poiDblClickHandler);
        poiDblClickHandler = null;
      }
    }
    // updateAdminUI erweitern:
    const origUpdateAdminUI = updateAdminUI;
    updateAdminUI = function() {
      origUpdateAdminUI();
      if (isAdmin) {
        enablePoiDblClick();
      } else {
        disablePoiDblClick();
      }
    };
    // Beim initialen Laden auch prüfen:
    if (typeof isAdmin !== 'undefined' && isAdmin) enablePoiDblClick();
  </script>

</body> 
</html>
