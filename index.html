<script>
  const DISCORD_ID = "917426398120005653";
  const songs = [
    { src: "song-1.mp3", title: "Люби меня", cover: "cover-1.jpeg" },
    { src: "song-2.mp3", title: "Song 2", cover: "cover-2.jpeg" }
  ];

  const $ = (id) => document.getElementById(id);
  const audio = $("audio"), video = $("bg"), scrub = $("scrub");
  let current = 0;

  const fmt = (s) => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + String(sec).padStart(2, "0");
  };

  const playIcon = (playing) => {
    $("play-icon").innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    $("play").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
  };

  function loadSong(i, autoplay = true) {
    current = (i + songs.length) % songs.length;
    const s = songs[current];
    audio.src = s.src;
    $("title").textContent = s.title;
    $("cover").src = s.cover;
    scrub.value = 0;
    if (autoplay) audio.play().catch(() => {});
  }

  // Start per Klick
  $("enter").addEventListener("click", () => {
    $("enter").hidden = true;
    $("page").hidden = false;
    audio.volume = parseFloat($("vol").value);
    video.play().catch(() => {});
    loadSong(0);
  });

  // Player
  $("play").addEventListener("click", () => audio.paused ? audio.play() : audio.pause());
  $("next").addEventListener("click", () => loadSong(current + 1));
  $("prev").addEventListener("click", () => {
    if (audio.currentTime > 3) audio.currentTime = 0;
    else loadSong(current - 1);
  });
  audio.addEventListener("play", () => playIcon(true));
  audio.addEventListener("pause", () => playIcon(false));
  audio.addEventListener("ended", () => loadSong(current + 1));
  audio.addEventListener("loadedmetadata", () => {
    scrub.max = audio.duration;
    $("dur").textContent = fmt(audio.duration);
  });
  audio.addEventListener("timeupdate", () => {
    scrub.value = audio.currentTime;
    $("time").textContent = fmt(audio.currentTime);
    scrub.style.setProperty("--pct", (audio.currentTime / audio.duration * 100 || 0) + "%");
  });
  scrub.addEventListener("input", () => audio.currentTime = scrub.value);
  $("vol").addEventListener("input", (e) => audio.volume = e.target.value);

  // Discord-Status über Lanyard (live per WebSocket)
  const statusText = { online: "Online", idle: "Abwesend", dnd: "Bitte nicht stören", offline: "Offline" };

  function render(d) {
    const u = d.discord_user;
    $("discord-name").textContent = u.global_name || u.username;
    if (u.avatar) $("discord-avatar").src = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`;

    const st = d.discord_status || "offline";
    $("status-dot").className = "dot " + st;
    $("status-label").title = statusText[st];

    const game = (d.activities || []).find(a => a.type === 0);
    const custom = (d.activities || []).find(a => a.type === 4);
    const app = $("discord-app");
    if (game) {
      $("discord-play").textContent = "Spielt " + game.name;
      const img = game.assets?.large_image;
      if (img && !img.startsWith("mp:")) {
        app.src = `https://cdn.discordapp.com/app-assets/${game.application_id}/${img}.png`;
        app.hidden = false;
      } else app.hidden = true;
    } else {
      $("discord-play").textContent = custom?.state || "currently doing nothing";
      app.hidden = true;
    }

    const sp = d.spotify, card = $("spotify");
    if (d.listening_to_spotify && sp) {
      $("spotify-cover").src = sp.album_art_url;
      $("spotify-title").textContent = sp.song;
      $("spotify-artist").textContent = sp.artist;
      card.href = "https://open.spotify.com/track/" + sp.track_id;
      card.hidden = false;
    } else card.hidden = true;
  }

  function connect() {
    const ws = new WebSocket("wss://api.lanyard.rest/socket");
    let beat;
    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      if (msg.op === 1) {
        beat = setInterval(() => ws.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
      }
      if (msg.op === 0) render(msg.d);
    };
    ws.onclose = () => { clearInterval(beat); setTimeout(connect, 5000); };
  }
  connect();
</script>
