<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Corleone City - KARTE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

<style>
html, body { height:100%; margin:0; }
#map { height:100vh; background:#84B2CE; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// GTA Map Setup (dein Original behalten)
const bounds = [[-3000, -3000], [3000, 3000]];

const map = L.map('map', {
  crs: L.CRS.Simple,
  center: [-170, 125],
  zoom: 5,
  minZoom: 2,
  maxZoom: 5,
  maxBounds: bounds
});

// 👉 DEINE TILES (falls vorhanden)
L.tileLayer('tiles/{z}/{x}/{y}.png', {
  minZoom: 2,
  maxZoom: 5,
  noWrap: true,
  bounds: bounds
}).addTo(map);

// 👉 FALLBACK falls Tiles fehlen
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);


// ✅ POIs aus JSON laden
fetch('data/pois.json')
.then(res => res.json())
.then(pois => {
  pois.forEach(poi => {

    let iconHtml = `<i class="${poi.icon}" style="color:${poi.iconColor};font-size:20px;"></i>`;

    L.marker([poi.x, poi.y], {
      icon: L.divIcon({
        html: iconHtml,
        className: ''
      })
    })
    .addTo(map)
    .bindPopup(poi.name);

  });
})
.catch(err => console.error("POI Fehler:", err));

</script>

</body>
</html>
