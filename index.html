<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    background: #7fa6c9;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .map-container {
    position: relative;
    width: 600px;
    height: 600px;
  }

  .map-container img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .zone {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    border: 2px solid rgba(255,255,255,0.6);
  }

  /* Wasser Zonen */
  .north {
    top: -20%;
    left: 0;
    width: 100%;
    height: 60%;
    background: #4da6ff;
  }

  .east {
    right: -20%;
    top: 0;
    width: 60%;
    height: 100%;
    background: #33cccc;
  }

  .south {
    bottom: -20%;
    left: 0;
    width: 100%;
    height: 60%;
    background: #3399ff;
  }

  .west {
    left: -20%;
    top: 0;
    width: 60%;
    height: 100%;
    background: #9966cc;
  }

  .label {
    position: absolute;
    color: white;
    font-weight: bold;
    font-size: 20px;
    text-shadow: 0 0 5px black;
  }

  .label.n { top: 5%; left: 40%; }
  .label.e { top: 45%; right: 5%; }
  .label.s { bottom: 5%; left: 40%; }
  .label.w { top: 45%; left: 5%; }
</style>
</head>

<body>

<div class="map-container">
  <!-- DEIN BILD HIER -->
  <img src="DEIN_BILD_LINK_HIER" alt="Karte">

  <!-- Wasser Bezirke -->
  <div class="zone north"></div>
  <div class="zone east"></div>
  <div class="zone south"></div>
  <div class="zone west"></div>

  <!-- Labels -->
  <div class="label n">Nord Wasser</div>
  <div class="label e">Ost Wasser</div>
  <div class="label s">Süd Wasser</div>
  <div class="label w">West Wasser</div>
</div>

</body>
</html>
