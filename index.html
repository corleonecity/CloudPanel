<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colin</title>
  <meta name="description" content="Carry Freedom in Your Heart" />
  <meta name="theme-color" content="#07080c" />
  <link rel="preconnect" href="https://cobalt-fleet-wind-finch.grok.me" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07080c;
      --fg: #f3f4f6;
      --muted: #a3a8b2;
      --glass: #101218;
      --sans: "Onest", ui-sans-serif, system-ui, sans-serif;
      --display: "Chillax", "Onest", ui-sans-serif, system-ui, sans-serif;
      --cursor: url("cursor.png") 16 16, auto;
    }
    * { box-sizing: border-box; }
    html, body, button, a, input { cursor: var(--cursor); }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--fg);
      font-family: var(--sans);
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
    .stage { min-height: 100vh; position: relative; overflow: hidden; }
    .yt-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #000; }
    .yt-bg video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      min-width: 100%; min-height: 100%;
      object-fit: cover; pointer-events: none; background: #000;
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 10%, color-mix(in oklab, var(--ink) 18%, transparent) 62%, color-mix(in oklab, var(--ink) 88%, transparent) 100%);
    }
    .enter {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #000;
    }
    .enter[hidden] { display: none; }
    .mark { width: 48px; height: 48px; animation: pulse 2.8s ease-in-out infinite; }
    .klicken { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .wrap {
      position: relative; z-index: 10;
      min-height: 100vh; width: 100%; margin: 0;
      display: flex; align-items: center; justify-content: center; gap: 22px;
      padding: 72px 20px;
    }
    .links { display: flex; flex-direction: column; gap: 8px; width: 250px; flex: none; }
    .stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .pill {
      display: flex; align-items: center; gap: 8px;
      min-height: 46px; padding: 4px 10px 4px 4px; border-radius: 999px;
      text-decoration: none; color: #fff;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 12px 28px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
    }
    .pill:hover { background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.12)); }
    .pill-ico { width: 34px; height: 34px; border-radius: 999px; object-fit: cover; flex: none; background: rgba(255,255,255,.16); }
    .pill-copy { flex: 1; min-width: 0; text-align: center; padding-right: 2px; }
    .pill-title { display: block; font-weight: 700; font-size: 12px; letter-spacing: .01em; line-height: 1.15; }
    .pill-url { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 1px; font-size: 10px; color: rgba(255,255,255,.8); }
    @media (max-width: 980px) {
      .wrap { display: flex; flex-direction: column; max-width: 28rem; margin: 0 auto; padding: 64px 16px; }
      .links { width: 100%; justify-self: stretch; order: 2; }
    }
    .wrap[hidden] { display: none; }
    .glass {
      background: color-mix(in oklab, var(--glass) 52%, transparent);
      border: 1px solid color-mix(in oklab, var(--fg) 10%, transparent);
      box-shadow: 0 24px 60px color-mix(in oklab, black 45%, transparent);
      backdrop-filter: blur(18px);
      border-radius: 16px;
    }
    .card { position: relative; padding: 28px 20px 18px; }
    .avatar {
      position: absolute; left: 18px; top: 0; width: 80px; height: 80px;
      transform: translateY(-46%); border-radius: 22px; object-fit: cover;
      box-shadow: 0 10px 24px rgba(0,0,0,.4);
    }
    .meta {
      min-height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .row { display: inline-flex; align-items: center; gap: 6px; }
    .sep { opacity: .7; }
    .name-row { margin-top: 18px; display: flex; align-items: center; gap: 8px; }
    h1 {
      position: relative; margin: 0;
      font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: 0.02em;
    }
    .sparkle {
      position: absolute; left: -16px; right: -16px; top: -12px; bottom: -12px; pointer-events: none;
      background: url("sparkle.gif") 0 0 / 90px 68px;
      mix-blend-mode: screen;
    }
    .gem {
      width: 24px; height: 24px; border-radius: 999px;
      display: grid; place-items: center; background: color-mix(in oklab, var(--fg) 10%, transparent);
    }
    .bio { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
    .discord { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .face { position: relative; width: 44px; height: 44px; flex: none; }
    .face img { width: 44px; height: 44px; border-radius: 999px; object-fit: cover; }
    .badge {
      position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px;
      border-radius: 999px; background: #0c0e14; display: grid; place-items: center;
    }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: #80848e; }
    .dot.online { background: #23a55a; }
    .dot.idle { background: #f0b232; }
    .dot.dnd { background: #f23f43; }
    .dot.offline { background: transparent; border: 2px solid #80848e; }
    .who { margin: 0; font-size: 14px; font-weight: 500; }
    .act { margin: 0; font-size: 12px; color: var(--muted); }
    .player { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .cover { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex: none; }
    .track { min-width: 0; flex: 1; }
    .title { margin: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scrub-row { margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; flex: none; }
    .controls button { width: 32px; height: 32px; display: grid; place-items: center; }
    .time { width: 36px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .time.end { text-align: right; }
    input[type="range"].vol {
      width: 118px; height: 18px;
    }
    input[type="range"].vol::-webkit-slider-runnable-track {
      height: 4px; background: #fff;
    }
    input[type="range"].vol::-webkit-slider-thumb {
      width: 14px; height: 14px; margin-top: -5px; background: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.18);
    }
    .loud {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; color: #fff;
      background: rgba(12,12,16,.62);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    @media (hover: none) and (pointer: coarse) { .loud { display: none; } }
    @media (max-width: 800px) { .loud { display: none; } }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px; border-radius: 999px;
      background: linear-gradient(to right, var(--fg) var(--pct, 0%), color-mix(in oklab, var(--fg) 28%, transparent) var(--pct, 0%));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border: 0; border-radius: 999px; background: var(--fg);
    }
    @keyframes pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="yt-bg" id="yt">
      <video id="bg" src="https://pub-a1f6c25dd7294e5ea77b520b4b52a8ee.r2.dev/1012%20(2)(1).mp4" muted playsinline webkit-playsinline="true" loop preload="auto"></video>
    </div>

    <button class="enter" id="enter" type="button">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="currentColor" d="M32 4c1.2 12.4 8.6 22 20 26-11.4 4-18.8 13.6-20 26-1.2-12.4-8.6-22-20-26 11.4-4 18.8-13.6 20-26z" />
      </svg>

    <div class="wrap" id="page" hidden>
      <label class="loud">
        <svg id="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-2-3.1v6.2a3.5 3.5 0 0 0 2-3.1z"/></svg>

      <nav class="links" aria-label="Links">

          <img class="pill-ico" src="buttom1.jpeg" alt="" width="34" height="34" />
          <span class="pill-copy"><span class="pill-title">Discord Colin’s Community</span><span class="pill-url"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>discord.gg/4424J6EQBH</span></span>
        </a>
        <a class="pill" href="https://guns.lol/b" target="_blank" rel="noreferrer">
          <img class="pill-ico" src="buttom2.jpeg" alt="" width="48" height="48" />
          <span class="pill-copy"><span class="pill-title">/brook /b</span><span class="pill-url"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>https://guns.lol/b</span></span>
        </a>
        <a class="pill" href="https://guns.lol/death" target="_blank" rel="noreferrer">
          <img class="pill-ico" src="buttom3.jpeg" alt="" width="48" height="48" />
          <span class="pill-copy"><span class="pill-title">/mango /death</span><span class="pill-url"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>https://guns.lol/death</span></span>
        </a>
        <a class="pill" href="https://guns.lol/badge" target="_blank" rel="noreferrer">
          <img class="pill-ico" src="buttom4.jpeg" alt="" width="48" height="48" />
          <span class="pill-copy"><span class="pill-title">/badge /badges (You're Here)</span><span class="pill-url"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>https://guns.lol/badge</span></span>
        </a>
      </nav>
      <div class="stack">
      <section class="glass card">
        <img class="avatar" src="avatar.webp" alt="" width="76" height="76" />
        <div class="meta">
          <span class="row">◉ <span id="views">163</span></span>
          <span class="sep">|</span>
          <span class="row">Deutschland, Thüringen</span>
        </div>
        <div class="name-row">
          <h1>colinse21<span class="sparkle" aria-hidden="true"></span></h1>
          <span class="gem" title="Premium" aria-label="Premium">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M12 21 8 9l4-6 4 6z"/></svg>
          </span>
        </div>
        <p class="bio">Carry Freedom in Your Heart</p>
      </section>

      <section class="glass discord">

          <img id="discord-avatar" src="https://cdn.discordapp.com/avatars/917426398120005653/0fb9799e2a9097e840f91c6618ae735f.png?size=128" alt="" width="44" height="44" />
          <span class="badge" id="status-label"><span class="dot" id="status-dot"></span></span>
        </div>
        <div>
          <p class="who" id="discord-name">asuna.rb</p>
          <p class="act" id="discord-act">currently doing nothing</p>
        </div>
      </section>

      <section class="glass player">
        <img class="cover" id="cover" src="cover-1.jpeg" alt="" width="52" height="52" />
        <div class="track">
          <p class="title" id="title">Люби меня</p>
          <div class="scrub-row">
            <span class="time" id="time">0:00</span>
            <input id="scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Fortschritt" />
            <span class="time end" id="dur">0:00</span>
            <div class="controls">
              <button type="button" id="prev" aria-label="Vorheriger Titel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
              </button>
              <button type="button" id="play" aria-label="Abspielen">
                <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button type="button" id="next" aria-label="Nächster Titel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
      </div>
    </div>
  </main>
  <audio id="audio" preload="none"></audio>
  <script>
    const API = "https://cobalt-fleet-wind-finch.grok.me";
    const tracks = [
      { title: "Люби меня", src: "song-1.mp3", cover: "cover-1.jpeg" },
      { title: "Влюбился в неё", src: "song-2.mp3", cover: "cover-2.jpeg" }
    ];
    const audio = document.getElementById("audio");
    const scrub = document.getElementById("scrub");
    let index = 0;
    let playing = false;

    function clock(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ":" + String(s).padStart(2, "0");
    }
    function show(i) {
      index = (i + tracks.length) % tracks.length;
      const track = tracks[index];
      document.getElementById("title").textContent = track.title;
      document.getElementById("cover").src = track.cover;
      audio.src = track.src;
      document.getElementById("time").textContent = "0:00";
      document.getElementById("dur").textContent = "0:00";
      scrub.value = 0;
      scrub.style.setProperty("--pct", "0%");
    }
    function setIcon() {
      document.getElementById("play-icon").innerHTML = playing
        ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
      document.getElementById("play").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
    }
    function applyVol() {
      const vol = document.getElementById("vol");
      audio.volume = Number(vol.value);
      document.getElementById("vol-icon").innerHTML = Number(vol.value) === 0
        ? '<path d="M4 9v6h4l5 4V5L8 9H4zm13.2 3 2.1-2.1-1.4-1.4L15.8 10.6 13.7 8.5l-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/>'
        : '<path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-2-3.1v6.2a3.5 3.5 0 0 0 2-3.1z"/>';
    }
    document.getElementById("vol").addEventListener("input", applyVol);
    function play() {
      applyVol();
      audio.play().then(() => { playing = true; setIcon(); }).catch(() => { playing = false; setIcon(); });
    }
    function startVideo() {
      const bg = document.getElementById("bg");
      if (!bg) return;
      const phone = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.matchMedia("(max-width: 800px)").matches;
      if (phone) bg.src = "bg.mp4";
      bg.muted = true;
      bg.defaultMuted = true;
      bg.playsInline = true;
      bg.setAttribute("playsinline", "true");
      bg.setAttribute("webkit-playsinline", "true");
      const kick = () => { const pending = bg.play(); if (pending) pending.catch(() => {}); };
      kick();
      bg.addEventListener("loadeddata", kick, { once: true });
      bg.addEventListener("canplay", kick, { once: true });
    }
    let opened = false;
    function openPage() {
      if (opened) return;
      opened = true;
      startVideo();
      document.getElementById("enter").hidden = true;
      document.getElementById("page").hidden = false;
      show(0);
      play();
    }
    document.getElementById("enter").addEventListener("pointerup", openPage);
    document.getElementById("enter").addEventListener("click", openPage);
    document.getElementById("play").addEventListener("click", () => {
      if (audio.paused) play();
      else { audio.pause(); playing = false; setIcon(); }
    });
    document.getElementById("prev").addEventListener("click", () => { show(index - 1); play(); });
    document.getElementById("next").addEventListener("click", () => { show(index + 1); play(); });
    audio.addEventListener("timeupdate", () => {
      document.getElementById("time").textContent = clock(audio.currentTime);
      scrub.value = audio.currentTime;
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      scrub.style.setProperty("--pct", pct + "%");
    });
    audio.addEventListener("loadedmetadata", () => {
      document.getElementById("dur").textContent = clock(audio.duration);
      scrub.max = audio.duration || 0;
    });
    audio.addEventListener("ended", () => { show(index + 1); play(); });
    scrub.addEventListener("input", () => {
      audio.currentTime = Number(scrub.value);
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      scrub.style.setProperty("--pct", pct + "%");
    });

    const views = document.getElementById("views");
    const wait = 10 * 60 * 1000;
    let count = true;
    try {
      const last = Number(localStorage.getItem("colin-view-at") || 0);
      count = !last || Date.now() - last >= wait;
    } catch (e) { count = true; }
    fetch(API + "/api/views", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ increment: count }) })
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        if (!data || typeof data.count !== "number") return;
        views.textContent = String(data.count);
        if (count) {
          try { localStorage.setItem("colin-view-at", String(Date.now())); } catch (e) {}
        }
      })
      .catch(() => {});

    function paintDiscord(card) {
      document.getElementById("discord-name").textContent = card.username || "asuna.rb";
      document.getElementById("discord-act").textContent = card.activity || "currently doing nothing";
      if (card.avatar) document.getElementById("discord-avatar").src = card.avatar;
      const dot = document.getElementById("status-dot");
      dot.className = "dot " + (card.status || "offline");
      const label = card.status === "online" ? "online" : card.status === "idle" ? "abwesend" : card.status === "dnd" ? "nicht stören" : "offline";
      document.getElementById("status-label").title = label;
    }
    function pullDiscord() {
      fetch(API + "/api/discord").then((res) => res.ok ? res.json() : null).then((data) => { if (data) paintDiscord(data); }).catch(() => {});
    }
    pullDiscord();
    setInterval(pullDiscord, 20000);
  </script>
</body>
</html>
