<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colin</title>
  <meta name="description" content="Carry Freedom in Your Heart" />
  <meta name="theme-color" content="#07080c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07080c;
      --fg: #f3f4f6;
      --muted: #a3a8b2;
      --glass: #101218;
      --sans: "Onest", ui-sans-serif, system-ui, sans-serif;
      --display: "Chillax", "Onest", ui-sans-serif, system-ui, sans-serif;
      --cursor: url("cursor.png") 16 16, auto;
    }
    * { box-sizing: border-box; }
    html, body, button, a, input { cursor: var(--cursor); }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--fg);
      font-family: var(--sans);
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
    .stage { min-height: 100vh; position: relative; overflow: hidden; }
    .yt-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: #000; }
    .yt-bg[hidden] { display: none; }
    .yt-bg iframe {
      position: absolute; top: 50%; left: 50%;
      width: 3840px; height: 2160px; max-width: none; border: 0;
      transform: translate(-50%, -50%) scale(max(100vw / 3840px, 100vh / 2160px));
    }
    .spot { width: 100%; height: 80px; border: 0; border-radius: 16px; display: block; }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 10%, color-mix(in oklab, var(--ink) 18%, transparent) 62%, color-mix(in oklab, var(--ink) 88%, transparent) 100%);
    }
    .enter {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #000;
    }
    .enter[hidden] { display: none; }
    .mark { width: 48px; height: 48px; animation: pulse 2.8s ease-in-out infinite; }
    .klicken { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .wrap {
      position: relative; z-index: 10;
      min-height: 100vh; width: 100%; max-width: 28rem; margin: 0 auto;
      display: flex; flex-direction: column; justify-content: center; gap: 12px;
      padding: 64px 16px;
    }
    .wrap[hidden] { display: none; }
    .glass {
      background: color-mix(in oklab, var(--glass) 52%, transparent);
      border: 1px solid color-mix(in oklab, var(--fg) 10%, transparent);
      box-shadow: 0 24px 60px color-mix(in oklab, black 45%, transparent);
      backdrop-filter: blur(18px);
      border-radius: 16px;
    }
    .card { padding: 16px 20px 20px; }
    .top { display: flex; align-items: flex-start; gap: 12px; }
    .avatar { width: 64px; height: 64px; border-radius: 999px; object-fit: cover; flex: none; }
    .meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 4px; font-size: 12px; color: var(--muted); }
    .row { display: inline-flex; align-items: center; gap: 6px; }
    .name-row { margin-top: 16px; display: flex; align-items: center; gap: 8px; }
    h1 {
      position: relative; margin: 0;
      font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: 0.02em;
    }
    .sparkle {
      position: absolute; left: -16px; right: -16px; top: -12px; bottom: -12px; pointer-events: none;
      background: url("sparkle.gif") 0 0 / 90px 68px;
      mix-blend-mode: screen;
    }
    .gem {
      width: 24px; height: 24px; border-radius: 999px;
      display: grid; place-items: center; background: color-mix(in oklab, var(--fg) 10%, transparent);
    }
    .bio { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
    .discord { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .face { position: relative; width: 44px; height: 44px; flex: none; }
    .face img { width: 44px; height: 44px; border-radius: 999px; object-fit: cover; }
    .badge {
      position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px;
      border-radius: 999px; background: #0c0e14; display: grid; place-items: center;
    }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: #80848e; }
    .dot.online { background: #23a55a; }
    .dot.idle { background: #f0b232; }
    .dot.dnd { background: #f23f43; }
    .dot.offline { background: transparent; border: 2px solid #80848e; }
    .who { margin: 0; font-size: 14px; font-weight: 500; }
    .act { margin: 0; font-size: 12px; color: var(--muted); }
    .player { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .cover { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex: none; }
    .track { min-width: 0; flex: 1; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .title { margin: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .controls { display: flex; flex: none; }
    .controls button { width: 44px; height: 44px; display: grid; place-items: center; }
    .scrub-row { display: flex; align-items: center; gap: 8px; }
    .time { width: 32px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .time.end { text-align: right; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px; border-radius: 999px;
      background: linear-gradient(to right, var(--fg) var(--pct, 0%), color-mix(in oklab, var(--fg) 28%, transparent) var(--pct, 0%));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border: 0; border-radius: 999px; background: var(--fg);
    }
    @keyframes pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="yt-bg" id="yt" hidden>
      <iframe id="yt-frame" title="Hintergrund" allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>
    <div class="vignette" hidden id="shade"></div>

    <button class="enter" id="enter" type="button">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="currentColor" d="M32 4c1.2 12.4 8.6 22 20 26-11.4 4-18.8 13.6-20 26-1.2-12.4-8.6-22-20-26 11.4-4 18.8-13.6 20-26z" />
      </svg>
      <span class="klicken">klicken</span>
    </button>

    <div class="wrap" id="page" hidden>
      <section class="glass card">
        <div class="top">
          <img class="avatar" src="avatar.webp" alt="" width="72" height="72" />
          <div class="meta">
            <span class="row"><span aria-hidden="true">◉</span> <span id="views">163</span></span>
            <span class="row">Deutschland, Thüringen</span>
          </div>
        </div>
        <div class="name-row">
          <h1>colinse21<span class="sparkle" aria-hidden="true"></span></h1>
          <span class="gem" title="Premium" aria-label="Premium">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M12 21 8 9l4-6 4 6z"/></svg>
          </span>
        </div>
        <p class="bio">Carry Freedom in Your Heart</p>
      </section>

      <section class="glass discord">
        <div class="face">
          <img id="discord-avatar" src="https://cdn.discordapp.com/avatars/917426398120005653/0fb9799e2a9097e840f91c6618ae735f.png?size=128" alt="" width="44" height="44" />
          <span class="badge" id="status-label"><span class="dot" id="status-dot"></span></span>
        </div>
        <div>
          <p class="who" id="discord-name">asuna.rb</p>
          <p class="act" id="discord-act">currently doing nothing</p>
        </div>
      </section>

      <iframe class="spot" title="Люби меня" src="https://open.spotify.com/embed/track/6r9DYAeSXuDNIqtH2pEFSj?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <iframe class="spot" title="Влюбился в неё" src="https://open.spotify.com/embed/track/4DbGntPVyXDvu9vFCYQCcW?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </main>
  <script>
    document.getElementById("enter").addEventListener("click", () => {
      document.getElementById("enter").hidden = true;
      document.getElementById("page").hidden = false;
      const frame = document.getElementById("yt-frame");
      frame.src = "https://www.youtube-nocookie.com/embed/yAKO8TPZLm8?autoplay=1&mute=1&controls=0&start=70&modestbranding=1&rel=0&playsinline=1&loop=1&playlist=yAKO8TPZLm8&disablekb=1&fs=0&iv_load_policy=3&vq=hd2160";
      document.getElementById("yt").hidden = false;
      document.getElementById("shade").hidden = false;
    });

    const views = document.getElementById("views");
    let count = true;
    try { count = sessionStorage.getItem("colin-db-view") !== "1"; } catch (e) { count = true; }
    fetch("/api/views", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ increment: count }) })
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        if (!data || typeof data.count !== "number") return;
        views.textContent = String(data.count);
        try { sessionStorage.setItem("colin-db-view", "1"); } catch (e) {}
      })
      .catch(() => {});

    function paintDiscord(card) {
      document.getElementById("discord-name").textContent = card.username || "asuna.rb";
      document.getElementById("discord-act").textContent = card.activity || "currently doing nothing";
      if (card.avatar) document.getElementById("discord-avatar").src = card.avatar;
      const dot = document.getElementById("status-dot");
      dot.className = "dot " + (card.status || "offline");
      const label = card.status === "online" ? "online" : card.status === "idle" ? "abwesend" : card.status === "dnd" ? "nicht stören" : "offline";
      document.getElementById("status-label").title = label;
    }
    function pullDiscord() {
      fetch("/api/discord").then((res) => res.ok ? res.json() : null).then((data) => { if (data) paintDiscord(data); }).catch(() => {});
    }
    pullDiscord();
    setInterval(pullDiscord, 20000);
  </script>
</body>
</html>
