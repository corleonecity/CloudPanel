<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SOC Diensthandbuch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Optionaler Header (kannst du anpassen oder entfernen) */
        .header {
            background: #f8f9fa;
            padding: 12px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1a73e8;
        }

        .header a {
            color: #5f6368;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .header a:hover {
            background: #e8eaed;
        }

        /* Container für den iFrame */
        .iframe-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #fff;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fallback für Browser ohne iframe-Unterstützung */
        .fallback {
            display: none;
            padding: 40px;
            text-align: center;
            color: #5f6368;
        }

        .fallback a {
            color: #1a73e8;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📘 SOC Diensthandbuch</h1>
        <a href="https://sites.google.com/view/soc-diensthandbuch/startseite" target="_blank" rel="noopener noreferrer">
            Bei Problemen direkt öffnen ↗
        </a>
    </div>

    <div class="iframe-container">
        <iframe 
            src="https://sites.google.com/view/soc-diensthandbuch/startseite" 
            title="SOC Diensthandbuch"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals allow-storage-access-by-user-activation">
        </iframe>
        <div class="fallback">
            <p>Dein Browser unterstützt keine eingebetteten Inhalte.<br>
            <a href="https://sites.google.com/view/soc-diensthandbuch/startseite" target="_blank">Hier klicken, um das Handbuch direkt zu öffnen</a></p>
        </div>
    </div>

    <script>
        // Optional: Fehlerbehandlung falls der iframe nicht laden kann
        const iframe = document.querySelector('iframe');
        const fallback = document.querySelector('.fallback');
        
        if (iframe) {
            iframe.onerror = function() {
                iframe.style.display = 'none';
                fallback.style.display = 'block';
            };
            
            // Timeout-Fallback falls iframe nach 8 Sekunden nicht lädt
            setTimeout(() => {
                try {
                    // Prüft ob iframe geladen wurde (funktioniert nur bei gleicher Herkunft, hier nicht)
                    // Wir nutzen einen einfachen Ansatz: wenn iframe sichtbar ist, aber Inhalt leer wirkt
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow?.document;
                    if (!iframeDoc || iframeDoc.URL === 'about:blank') {
                        // Kein Zugriff wegen CORS, daher machen wir nichts - das ist normal bei externen Seiten
                        console.log('Iframe geladen (externer Inhalt)');
                    }
                } catch(e) {
                    // CORS-Fehler sind normal, ignorieren
                    console.log('Externe Seite geladen');
                }
            }, 8000);
        }
    </script>
</body>
</html>
